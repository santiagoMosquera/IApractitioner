<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KrakeDev · Ciclo de vida ML · Segunda y última barrida</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f3ff;background:#09101f;font-size:16px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 90% 70% at 75% 0%,#1c3557,#09101f 70%);min-height:100vh}button{font:inherit;cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:14px;max-width:1180px;margin:auto;padding:24px 24px 8px}header .brand{letter-spacing:.08em;font-weight:900}header .brand span{color:#ff607c}header .tag{font-size:12px;color:#adcaeb;border:1px solid #37506c;border-radius:30px;padding:7px 12px}.wrap{max-width:1180px;margin:auto;padding:18px 24px 120px}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#8fb5df;font-weight:800}h1{font-size:clamp(29px,4.5vw,49px);line-height:1.12;letter-spacing:-.035em;margin:13px 0 16px}h2{font-size:24px;letter-spacing:-.02em;margin:0 0 12px}h3{font-size:18px;margin:0 0 10px}p{color:#b9cbe0;line-height:1.65}strong{color:#f7fbff}.lead{font-size:19px;max-width:900px}.card{background:#13223a;border:1px solid #294566;border-radius:18px;padding:23px;box-shadow:0 12px 30px #0002}.muted{color:#9eb9d4}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.concept{min-height:205px}.concept p{font-size:15px;line-height:1.8}.concept p strong{color:#ffffff;font-weight:800}.term-section{margin-top:24px}.callout p{line-height:1.7}.concept .num{color:#89e6d5;font-size:12px;font-weight:850;letter-spacing:.1em}.problem-list{padding-left:20px;color:#b9cbe0;line-height:1.55;font-size:14px}.problem-list li{margin-bottom:9px}.concept-note{font-size:12px;line-height:1.5;border-top:1px solid #2c4b69;padding-top:10px}.pill{display:inline-block;border:1px solid #34516e;padding:6px 11px;border-radius:99px;color:#c7dbf0;font-size:13px;margin:3px}.callout{background:#103b44;border:1px solid #236e76;border-radius:16px;padding:18px 22px;margin-top:18px}.warning{background:#3a2b27;border-color:#765246}.question{margin-top:22px;background:#172a47;border:1px solid #39577d;padding:21px;border-radius:17px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.answer{border:1px solid #425c7a;background:#203650;color:#edf6ff;text-align:left;border-radius:12px;padding:13px 15px;min-height:59px}.answer:hover{background:#2b4c72}.answer.correct{border-color:#50ddaf;background:#185345}.answer.wrong{border-color:#e47a8e;background:#643240}.answer:disabled{cursor:default}.feedback{margin-top:13px;color:#bceade;min-height:25px}.rail{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0 27px}.rail button{border-radius:11px;border:1px solid #37526f;background:#13243c;color:#aec4de;padding:9px 11px;min-width:42px}.rail button.active{background:#346d9c;color:white;border-color:#7dbcf2}.rail button.done:not(.active){border-color:#3d857d}.grid-map{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.map-step{background:#132c49;border:1px solid #345c81;border-radius:15px;padding:15px;min-height:115px}.map-step b{display:block;color:#84dbc9;margin-bottom:10px}.map-step span{color:#eaf4ff}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1427ef;border-top:1px solid #29415e;backdrop-filter:blur(12px);padding:13px 24px;display:flex;justify-content:center;gap:14px;align-items:center;z-index:10}.navinner{width:min(1130px,100%);display:flex;gap:12px;justify-content:space-between;align-items:center}.navbutton{background:#81e0ce;color:#061b27;font-weight:800;border:none;border-radius:10px;padding:12px 20px}.navbutton.secondary{background:#213a57;color:#e2eefc}.navbutton:disabled{opacity:.35;cursor:default}.counter{font-size:13px;color:#a3bedc}.hide{display:none!important}.choice-card{border:1px solid #365271;background:#13263f;padding:15px;border-radius:13px}.service-icon{font-size:24px}.subtitle{font-weight:700;color:#86dcca;font-size:13px}.summary-rows{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:16px}.summary-rows>div{padding:13px;border-radius:9px;background:#142740}.activityhint{font-size:13px;color:#a9c3dd}footer{margin-top:34px;font-size:12px;color:#718faf}@media(max-width:740px){.two,.three,.answers{grid-template-columns:1fr}.grid-map{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px 15px 130px}header{padding:18px 15px 4px}header .tag{display:none}.card{padding:16px}.nav{padding:11px 12px}.navbutton{padding:11px 13px}h1{font-size:29px}}
</style></head><body><header><div class="brand">KRAKE<span>DEV</span> · AWS AI PRACTITIONER</div><span class="tag">Ciclo de vida de Machine Learning</span></header><main class="wrap"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="lead" class="lead"></p><div id="content"></div><footer>KrakeDev · Formación en IA · Material interactivo de aula · Sin datos personales ni conexión a AWS</footer></main><div class="nav"><div class="navinner"><button class="navbutton secondary" id="prev">← Anterior</button><span class="counter" id="counter"></span><button class="navbutton" id="next">Siguiente →</button></div></div><script>
const DATA={"phases":[{"title":"Definir el objetivo","intro":"No comenzamos buscando un algoritmo: comenzamos identificando una decisión o problema.","concepts":[["Problema y valor de negocio","Identificar la decisión a mejorar, el beneficio esperado y si una predicción aporta valor frente a reglas fijas."],["Tipos de tarea","Clasificación: categoría; regresión: valor numérico; clustering: grupos sin categorías previas."],["Paradigmas de aprendizaje","Supervisado: ejemplos etiquetados; no supervisado: patrones sin etiquetas; por refuerzo: acciones y recompensas."],["Criterio de éxito","Definir el error más costoso y cómo evaluar el resultado antes de seleccionar la métrica."]],"trap":"","question":"Una entidad necesita decidir qué compras revisar por posible fraude. Quiere detectar la mayor cantidad de fraudes reales aunque algunas compras legítimas se revisen. ¿Qué combinación describe mejor su objetivo?","options":["Clasificación supervisada y prioridad en recall para detectar fraudes reales","Regresión y prioridad en F1 para estimar importes","Clasificación supervisada y prioridad en precision para minimizar falsas alertas","Clustering no supervisado y evaluación por accuracy"],"answer":0,"why":"La respuesta es binaria (clasificación supervisada) y se busca detectar la mayor cantidad posible de fraudes reales (recall).","examples":["Banco: detectar posibles fraudes es clasificación. Si lo importante es descubrir la mayor cantidad posible de fraudes, priorizamos recall.","Inmobiliaria: estimar el precio de venta de una vivienda es regresión porque la respuesta es un valor numérico; si el objetivo es segmentar compradores sin etiquetas previas, usaríamos clustering."],"reinforcement":[{"q":"Una empresa quiere estimar el monto que gastará cada cliente el próximo mes. ¿Qué tipo de problema es?","options":["Clasificación supervisada porque compara clientes","Regresión porque predice un valor numérico","Clustering porque cada cliente pertenece a un grupo","Aprendizaje por refuerzo porque cambia con el tiempo"],"answer":1,"why":"Regresión predice valores numéricos; clasificación predice categorías."},{"q":"Una empresa no tiene segmentos de clientes definidos y busca descubrir grupos de comportamiento. ¿Qué enfoque corresponde?","options":["Aprendizaje por refuerzo con recompensas","Clasificación supervisada de categorías conocidas","Regresión supervisada del ingreso mensual","Clustering dentro del aprendizaje no supervisado"],"answer":3,"why":"Clustering identifica grupos sin etiquetas previas; es una tarea no supervisada."}]},{"title":"Recolectar datos","intro":"Los ejemplos disponibles delimitan lo que el modelo podrá aprender.","concepts":[["Fuentes de datos","Fuentes internas y externas relevantes: transacciones bancarias, registros de clientes, inventarios, sensores, correos, fotografías y grabaciones; deben corresponder al objetivo de negocio."],["Datos estructurados y no estructurados","Datos estructurados: organizados en campos o columnas, como ID, fecha, monto y canal de una transacción, o inventario por producto. Datos no estructurados: correos libres, documentos narrativos, fotografías, audio y video. Una serie temporal numérica puede ser estructurada cuando se registra con fecha y valor."],["Etiquetados y sin etiquetar","Datos etiquetados: ya incluyen la respuesta conocida (por ejemplo, fraude confirmado / compra legítima). Datos sin etiquetar: contienen observaciones, pero no la respuesta que se desea predecir."],["Representatividad y sesgo","Representatividad: al recolectar, buscamos incluir los distintos casos que el modelo encontrará en producción (por ejemplo, compras presenciales y por internet). Sesgo de representación: ocurre cuando la muestra favorece unos grupos o situaciones y deja otros poco representados; esto puede provocar errores desiguales. En la fase 3, EDA nos ayudará a detectar esos desequilibrios. Ejemplo: un banco recoge datos principalmente de compras presenciales aunque también evaluará compras por internet."]],"trap":"","question":"Un banco entrena un detector de fraude con transacciones realizadas solo en comercios físicos, pero luego lo aplicará también a compras en línea. ¿Cuál es la mejor decisión en esta fase?","options":["Mantener los datos actuales y subir el umbral de clasificación para compensar","Cambiar a regresión porque los canales son distintos","Agregar compras en línea representativas antes de entrenar, con etiquetas verificadas","Añadir más transacciones físicas idénticas para aumentar el tamaño de la muestra"],"answer":2,"why":"El problema es la representatividad: el conjunto de datos debe reflejar los canales donde se utilizará el modelo.","examples":["Banco: el historial de transacciones (fecha, monto, comercio, canal, resultado de fraude) es estructurado. Las grabaciones de reclamos y correos escritos por clientes son no estructurados. Para detectar fraudes en web y tiendas, recolectar ejemplos de ambos canales.","Salud: un hospital recopila análisis con columnas (edad, presión, diagnóstico) y también radiografías e informes de texto libre. Si entrena solo con pacientes adultos de una ciudad, puede fallar al atender otras edades o regiones: problema de representatividad y sesgo de muestra."],"reinforcement":[{"q":"Una aseguradora tiene columnas como póliza, monto y fecha, además de fotos de daños y audios de clientes. ¿Qué clasificación de datos es correcta?","options":["Las tablas son estructuradas; fotos y audios son no estructurados","Todos son estructurados porque están guardados en un sistema","Las fotos son estructuradas y las fechas no estructuradas","El tipo de dato depende únicamente de que exista una etiqueta"],"answer":0,"why":"Tablas con columnas son estructuradas; imágenes y audio normalmente son no estructurados."},{"q":"Una tienda entrena un modelo con clientes de grandes ciudades, pero lo usará también en zonas rurales. ¿Qué riesgo identifica primero?","options":["Inferencia asíncrona por mayor distancia geográfica","Falta de representatividad y posible sesgo hacia la población urbana","Sobreajuste causado necesariamente por demasiadas variables","Fuga de datos causada por tener varias ciudades"],"answer":1,"why":"Cuando la muestra no cubre poblaciones donde se aplicará el modelo, surge sesgo de representación."}]},{"title":"Preparar y explorar datos","intro":"Antes de entrenar, comprobamos si los datos son confiables, coherentes y comparables.","concepts":[["Data cleaning (limpieza)","Data cleaning (limpieza de datos): identificar y tratar valores ausentes, errores, registros duplicados y datos inconsistentes. Ejemplos: una compra repetida dos veces o una fecha imposible."],["Data preprocessing (preprocesamiento)","Data preprocessing (preprocesamiento): dejar los datos en un formato utilizable por el modelo, por ejemplo unificar formatos de fechas, preparar categorías o ajustar el formato de imágenes, según la tarea."],["EDA — Exploratory Data Analysis","EDA significa Exploratory Data Analysis (análisis exploratorio de datos). Consiste en examinar y resumir los datos recolectados antes de entrenar: detectar valores extraños, revisar distribuciones y tendencias, e identificar si ciertos grupos o categorías están insuficientemente representados. Ejemplo: encontrar que casi todas las transacciones provienen del canal presencial y muy pocas del canal web. Si falta representatividad, podemos volver a la fase 2 y recolectar más ejemplos."],["Training / validation / test","Training (entrenamiento): ejemplos con los que el modelo aprende. Validation (validación): datos para comparar y ajustar decisiones. Test (prueba): conjunto reservado para evaluar el modelo final con casos que no guiaron su entrenamiento."],["Data leakage (fuga de datos)","Data leakage (fuga de datos): ocurre cuando información que debería permanecer fuera del entrenamiento influye en el modelo o en su evaluación. Por ejemplo, si se usan transacciones del conjunto de prueba para entrenar, el resultado de la prueba puede parecer mejor de lo que realmente será con datos nuevos. También ocurre si usamos para predecir un dato que solo se conoce después de la decisión. Para evitarlo, separamos los conjuntos y reservamos el de prueba hasta el final."]],"trap":"","question":"Una tienda prepara un modelo para predecir devoluciones. Antes de entrenar, utiliza también los registros reservados para la prueba final al calcular información que incorpora a su preparación del modelo. El resultado de prueba parece excelente. ¿Cuál es el riesgo principal?","options":["Sesgo de representación, porque faltan sucursales en el conjunto","Underfitting, porque el modelo aún no aprendió relaciones suficientes","Concept drift, porque cambió la relación entre ventas y devoluciones","Data leakage, porque los datos de prueba influyeron en el entrenamiento"],"answer":3,"why":"Data leakage contamina la evaluación: el conjunto de prueba no debe influir en el entrenamiento ni en las decisiones de ajuste.","examples":["Comercio electrónico: el equipo limpia registros duplicados y examina con EDA sus datos. Al dividir las compras en entrenamiento, validación y prueba, debe impedir que información de las compras reservadas para prueba influya en el entrenamiento; de lo contrario, aparece data leakage.","Banco: un modelo debe alertar sobre fraude antes de aprobar una compra. El monto y el canal están disponibles en ese momento; el dictamen de una investigación realizada días después no puede usarse como variable de entrada. Hacerlo sería data leakage por incorporar información futura."],"reinforcement":[{"q":"En una base de ventas hay dos filas de la misma operación y algunas fechas inválidas. ¿Qué actividad corresponde primero?","options":["MLOps para generar una predicción inmediata","Despliegue de un endpoint antes de corregir la base","Data cleaning para tratar duplicados y errores","Inferencia por lotes sobre los duplicados"],"answer":2,"why":"Data cleaning busca corregir o retirar errores, duplicados e inconsistencias."},{"q":"Antes de entrenar, el equipo revisa gráficos de montos, valores extremos y cantidad de fraudes frente a compras normales. ¿Qué actividad realiza?","options":["Entrenamiento de hiperparámetros","Ajuste de un endpoint en tiempo real","Inferencia en producción","EDA: Exploratory Data Analysis o análisis exploratorio de datos"],"answer":3,"why":"EDA significa Exploratory Data Analysis: explorar y comprender la distribución de los datos."}]},{"title":"Seleccionar variables","intro":"Las entradas útiles ayudan al modelo; las irrelevantes pueden introducir ruido y atajos.","concepts":[["Feature (variable de entrada)","Atributo disponible para la predicción, como monto y horario de una transacción."],["Label o target (objetivo)","Label o target: respuesta correcta que el modelo aprende a predecir durante el entrenamiento supervisado. Ejemplos: fraude confirmado / no fraude, o precio de venta."],["Feature engineering","Feature engineering (ingeniería de características): proceso de crear, transformar o seleccionar variables de entrada que ayuden al modelo a identificar patrones relevantes. Ejemplo: de la fecha y hora de una transacción, obtener una característica «compra nocturna» para ayudar a detectar fraude."],["Relevancia de las variables","Buscar señales relacionadas con el objetivo, evitando depender de atributos irrelevantes o engañosos."]],"trap":"","question":"Una empresa predice si una transacción es fraudulenta a partir de su monto, hora y frecuencia. ¿Qué representa «fraude confirmado» en sus ejemplos supervisados?","options":["Un indicador de inferencia por lotes","Un hiperparámetro elegido antes de entrenar","La etiqueta (target) que el modelo debe aprender a predecir","Una feature adicional que el modelo siempre recibirá durante la compra"],"answer":2,"why":"El resultado conocido es la etiqueta; monto, hora y frecuencia son variables de entrada.","examples":["Banco: monto, hora y cantidad reciente de compras pueden ser features; «fraude confirmado» es el target que se aprende a predecir.","Inmobiliaria: área, ubicación y antigüedad son features; el precio final de venta es el target. Feature engineering puede crear una variable útil como antigüedad de la vivienda a partir del año de construcción."],"reinforcement":[{"q":"En un modelo que predice el precio de viviendas, ¿cuál es el target?","options":["Antigüedad de la construcción","Superficie del terreno","Precio de venta que se quiere predecir","Ubicación de la vivienda"],"answer":2,"why":"El target es la respuesta que se busca predecir; las demás son posibles features."},{"q":"De la fecha de una compra se obtiene el día de la semana para ayudar al modelo. ¿Qué concepto representa?","options":["Feature engineering","Inferencia asíncrona","Accuracy","Data drift"],"answer":0,"why":"Feature engineering crea o transforma características que pueden ayudar a predecir."}]},{"title":"Entrenar el modelo","intro":"El algoritmo ajusta parámetros con ejemplos para capturar patrones que luego aplicará a datos nuevos.","concepts":[["Algoritmo frente a modelo","El algoritmo es el método de aprendizaje; el modelo es el resultado entrenado que aplicamos a datos nuevos."],["Parámetros e hiperparámetros","Parámetros: valores internos que el modelo aprende a partir de los datos durante el entrenamiento. Ejemplo: al estimar precios de viviendas, el modelo aprende cuánto peso dar al tamaño o a la ubicación. Hiperparámetros: decisiones de configuración que se establecen antes o durante el proceso de entrenamiento, pero no se aprenden directamente de los ejemplos. Ejemplo: número de iteraciones de entrenamiento o profundidad máxima de un árbol de decisión. Idea clave: el entrenamiento ajusta parámetros; el equipo configura o prueba hiperparámetros para controlar cómo aprende el modelo."],["Overfitting (sobreajuste)","Aprende demasiado los ejemplos de entrenamiento y falla al recibir casos nuevos."],["Underfitting (subajuste)","No aprende suficientemente los patrones y falla incluso en los ejemplos que debería captar."]],"trap":"","question":"Un banco obtiene resultados excelentes con las transacciones usadas para entrenar su modelo, pero frecuentes errores con transacciones nuevas. ¿Cuál es la explicación más probable?","options":["Overfitting: el modelo se ajustó demasiado a los ejemplos históricos y generaliza mal","Underfitting: el modelo necesariamente falla igual en entrenamiento y en prueba","Clustering: un modelo supervisado no puede detectar fraude","Inferencia por lotes: el modelo no puede evaluar operaciones individuales"],"answer":0,"why":"Overfitting: un modelo puede memorizar particularidades de entrenamiento y desempeñarse mal con datos nuevos.","examples":["Inmobiliaria: para estimar el precio de una vivienda, el modelo aprende parámetros que relacionan tamaño y características con el precio. El equipo decide un hiperparámetro, como la profundidad máxima de un árbol, antes de comparar resultados.","Banco: un detector de fraude acierta casi todos los ejemplos históricos, pero falla con transacciones nuevas. Puede haber overfitting: aprendió detalles de entrenamiento que no generalizan. Se compara su desempeño con datos reservados."],"reinforcement":[{"q":"Una inmobiliaria entrena un modelo para estimar precios. El modelo aprende la influencia del tamaño y el equipo define cuántas iteraciones entrenarlo. ¿Cuál es la distinción correcta?","options":["La influencia aprendida es un parámetro; las iteraciones son un hiperparámetro","Ambos términos se refieren al conjunto de prueba","Tanto la influencia como las iteraciones se aprenden automáticamente","La influencia aprendida es un hiperparámetro; las iteraciones son parámetros"],"answer":0,"why":"Los parámetros se aprenden con datos; los hiperparámetros configuran el entrenamiento, como el número de iteraciones."},{"q":"Un modelo es demasiado simple y se equivoca tanto con sus datos de entrenamiento como con los nuevos. ¿Cuál es el diagnóstico más probable?","options":["Data leakage por usar el conjunto de prueba","Overfitting por memorizar demasiados detalles","Inferencia en tiempo real por baja latencia","Underfitting porque no aprendió bien los patrones"],"answer":3,"why":"Underfitting: el modelo no logra captar suficientemente los patrones, incluso en entrenamiento."},{"q":"Un sistema de predicción de precios acierta casi todos los precios del histórico con el que se entrenó, pero falla con ventas recientes que nunca había visto. ¿Qué fenómeno explica mejor el resultado?","options":["Underfitting porque el modelo no ha aprendido ni los patrones básicos","Data drift confirmado, aunque aún no se haya comparado la distribución de entradas","Overfitting porque el modelo aprendió demasiado los ejemplos históricos y generaliza mal","Batch inference porque se requieren predicciones de muchos inmuebles"],"answer":2,"why":"Overfitting: desempeño alto en entrenamiento y bajo con datos nuevos. Se debe evaluar la generalización, no solo los aciertos en los ejemplos conocidos."}]},{"title":"Validar y evaluar","intro":"No basta con que el modelo entregue una respuesta: debemos comprobar qué tipo de error comete.","concepts":[["Accuracy","Mide la proporción de aciertos globales, considerando positivos y negativos."],["Precision y recall","Precision: de las predicciones positivas, cuántas son correctas. Recall: de los positivos reales, cuántos se detectan."],["F1-score","Combina precision y recall, útil cuando interesa equilibrarlas; accuracy puede engañar con clases muy desbalanceadas."],["Métricas de negocio","Costo, tiempo, satisfacción del cliente y retorno de inversión (ROI) ayudan a comprobar si el modelo aporta valor real."]],"trap":"","question":"Un banco detecta muchos fraudes, pero casi todas sus alertas terminan siendo compras legítimas y el equipo ya no puede revisarlas. ¿Qué métrica necesita mejorar especialmente?","options":["ROI, porque reemplaza completamente las métricas del modelo","Precision, porque indica cuántas alertas de fraude son realmente correctas","Recall, porque indica cuántos fraudes reales detecta","Accuracy, porque siempre resuelve cualquier desbalance"],"answer":1,"why":"Al reducir falsos positivos respecto de todas las predicciones positivas, mejora precision; también importa el costo del negocio.","examples":["Banco: si el objetivo es detectar la mayor cantidad de fraudes posibles, priorizar recall; si demasiadas compras legítimas reciben alertas, buscar mejor precision.","Control de calidad: para identificar todos los productos defectuosos interesa recall; si cada revisión manual cuesta mucho, también importa precision. Accuracy resume aciertos totales, pero puede ser engañosa cuando casi todos los productos son correctos."],"reinforcement":[{"q":"Un detector de defectos deja pasar muchos productos realmente defectuosos. ¿Qué métrica se debe priorizar?","options":["Precision para reducir exclusivamente las alertas falsas","Recall para encontrar más casos realmente positivos","Confidence de un único producto","Accuracy porque sustituye a todas las métricas"],"answer":1,"why":"Recall mide cuántos positivos reales detecta el modelo."},{"q":"Una campaña envía ofertas costosas a clientes que el modelo marca como interesados, pero muchos no lo están. ¿Qué conviene mejorar?","options":["Accuracy de las fechas de entrega","Cantidad de registros sin etiquetas","Precision para que más predicciones positivas sean correctas","Recall para contactar a cualquier cliente potencial"],"answer":2,"why":"Precision mide qué proporción de los señalados como positivos realmente lo son."}]},{"title":"Desplegar e inferir","intro":"El modelo pasa de las pruebas a recibir entradas nuevas en una aplicación o proceso.","concepts":[["Inferencia","Usar un modelo ya entrenado para obtener resultados con datos que recibe ahora."],["Opciones de despliegue","Consumir una API administrada por AWS o publicar un endpoint propio de un modelo personalizado."],["Latencia y tiempo de respuesta","Latencia: tiempo que transcurre desde que la aplicación solicita una predicción hasta que recibe la respuesta. La modalidad se elige según si el usuario necesita esperar, cuántos registros hay que procesar, cuánto dura cada trabajo y qué tan frecuente es la demanda."],["Inferencia en tiempo real (real-time)","Se utiliza cuando cada solicitud necesita una respuesta inmediata o de baja latencia, generalmente durante una interacción. Casos: (1) autorizar o bloquear una compra sospechosa; (2) recomendar un producto mientras el cliente navega; (3) evaluar un riesgo al enviar una solicitud digital; (4) detectar una pieza defectuosa al pasar por una línea de producción. Clave: el resultado se necesita ahora, para esa solicitud."],["Inferencia por lotes (batch)","Procesa muchos registros disponibles conjuntamente, sin necesidad de devolver una predicción inmediata para cada uno. Casos: (1) calcular de madrugada el riesgo de miles de clientes; (2) estimar ventas de todas las sucursales para la próxima semana; (3) clasificar cientos de miles de documentos históricos; (4) generar recomendaciones para un catálogo completo durante la noche. Clave: gran volumen + procesamiento programado u offline; no requiere un endpoint permanente."],["Inferencia asíncrona (asynchronous)","La aplicación envía una solicitud que puede requerir bastante procesamiento; el trabajo se coloca en una cola y el resultado se recupera más adelante, sin mantener abierta la conexión esperando. Casos: (1) analizar un video extenso enviado por una aseguradora; (2) procesar un archivo de audio muy largo; (3) examinar un documento grande con un modelo complejo; (4) analizar una imagen médica de gran tamaño mediante un procesamiento prolongado. Clave: una solicitud puede tardar y el cliente no necesita quedarse esperando."],["Inferencia sin servidor (serverless)","AWS administra y escala la infraestructura. Resulta adecuada cuando las solicitudes llegan de forma esporádica o impredecible, y se quiere evitar mantener capacidad de inferencia siempre encendida. Casos: (1) un cotizador que recibe algunas consultas al día; (2) una aplicación interna usada solo ocasionalmente; (3) un prototipo que recibe tráfico irregular; (4) una campaña comercial que genera picos breves de consultas. Clave: demanda intermitente y administración automática; no garantiza la menor latencia porque puede existir tiempo de arranque."],["Cómo distinguir las cuatro modalidades","Tiempo real: una respuesta inmediata por solicitud. Batch: muchas entradas para procesar juntas y sin urgencia. Asíncrona: una solicitud individual que tarda y se completa después. Serverless: la característica principal es la infraestructura administrada que se adapta a demanda irregular, no una velocidad específica. Una aplicación serverless puede responder sincrónicamente: no confundas serverless con asíncrona."],["Servicios AWS y su función","Rekognition: imágenes; Textract: documentos; Comprehend: texto; Polly: texto→voz; Translate: idiomas; Transcribe: voz→texto."]],"trap":"","question":"Una empresa procesa miles de grabaciones almacenadas cada noche y no necesita respuestas mientras se graba la llamada. ¿Qué modalidad de inferencia encaja mejor?","options":["Tiempo real: cada grabación debe analizarse durante una llamada activa","Feature engineering: crea un modelo nuevo en producción","Entrenamiento continuo: cada archivo redefine el modelo","Por lotes (batch): procesar múltiples archivos almacenados periódicamente"],"answer":3,"why":"Cuando no se requiere respuesta inmediata y hay muchas entradas disponibles, la inferencia por lotes suele encajar.","examples":["Banco y tienda virtual: la aprobación antifraude y las recomendaciones mientras el cliente navega requieren baja latencia (tiempo real). Para recalcular el riesgo de todos los clientes durante la madrugada, es más adecuado batch.","Aseguradora y empresa pequeña: procesar un video largo cuya respuesta se consulta después corresponde a inferencia asíncrona; un cotizador con consultas poco frecuentes puede usar serverless para evitar infraestructura permanentemente encendida."],"reinforcement":[{"q":"Una aplicación necesita una respuesta del modelo mientras un cliente realiza una operación. ¿Qué modalidad corresponde?","options":["EDA sobre todo el histórico","Reentrenamiento previo a cada solicitud","Procesamiento en lotes nocturno","Inferencia en tiempo real mediante API/endpoint"],"answer":3,"why":"La inferencia en tiempo real busca responder durante la interacción."},{"q":"Se envían miles de facturas almacenadas para procesarlas durante la noche. ¿Qué modalidad describe mejor el caso?","options":["Aprendizaje por refuerzo","Entrenamiento supervisado de una nueva arquitectura","Inferencia por lotes (batch)","Selección de hiperparámetros antes del procesamiento"],"answer":2,"why":"Batch procesa conjuntos de entradas cuando no se requiere respuesta inmediata por cada una."},{"q":"Una plataforma de pagos debe responder antes de autorizar cada compra. ¿Qué criterio hace preferible la inferencia en tiempo real frente a batch?","options":["La necesidad de una latencia baja para cada decisión","La necesidad de entrenar un nuevo modelo para cada compra","La posibilidad de esperar hasta la madrugada para procesar operaciones","La obligación de procesar todos los pagos en un archivo semanal"],"answer":0,"why":"La latencia es el tiempo hasta recibir una respuesta. Cuando una transacción está en curso se requiere una respuesta de baja latencia."},{"q":"Una aseguradora recibe una solicitud de análisis de un archivo de audio muy largo; el resultado puede tardar minutos y recuperarse después. ¿Qué modalidad describe mejor esa solicitud individual?","options":["Real-time, porque la salida debe volver durante la misma conexión","Batch nocturno, porque toda solicitud larga implica miles de archivos","Serverless, porque garantiza una respuesta instantánea","Asíncrona, porque se envía la solicitud y el resultado se consulta después"],"answer":3,"why":"La inferencia asíncrona permite procesar solicitudes individuales de larga duración sin mantener al cliente esperando una respuesta síncrona."}]},{"title":"Monitorear y mejorar","intro":"Un modelo útil hoy puede dejar de serlo si cambia el contexto o aparecen nuevos tipos de casos.","concepts":[["Monitoreo de desempeño","Comprobar si precisión del servicio, resultados y tiempos de respuesta siguen siendo adecuados en producción."],["Cambios en los datos (drift)","Drift significa cambio a lo largo del tiempo. Data drift: cambian las características de los datos que recibe el modelo. Ejemplo: un banco pasa de recibir principalmente compras presenciales a muchas compras por internet. Concept drift: cambia la relación entre las entradas y la respuesta correcta. Ejemplo: los defraudadores adoptan nuevas estrategias, por lo que patrones antes confiables dejan de indicar fraude. No todo drift implica automáticamente un fallo, pero exige comprobar si las predicciones siguen siendo útiles."],["Reentrenamiento y mejora","Cuando el desempeño cae, recopilar nuevos ejemplos, evaluar y publicar una versión mejorada si se justifica."],["MLOps básico","DevOps (Development + Operations) reúne prácticas para que los equipos de desarrollo y operaciones publiquen, automaticen, supervisen y mantengan software de forma confiable. MLOps (Machine Learning Operations) aplica esa idea a los sistemas de Machine Learning: además del código, debemos gestionar datos, versiones del modelo, entrenamiento, evaluaciones, despliegues y rendimiento en producción. ¿Por qué hace falta algo adicional a DevOps? Porque el modelo puede perder calidad aunque la aplicación y sus servidores funcionen correctamente, por ejemplo, cuando cambian los patrones de fraude. Ejemplo: una empresa que usa DevOps publica automáticamente una nueva versión de su aplicación bancaria; con MLOps también registra qué versión del modelo antifraude está activa, comprueba su recall con datos recientes, evalúa una versión actualizada y puede volver a la anterior si falla. Idea clave: DevOps ayuda a operar software; MLOps extiende esas prácticas para operar modelos de ML y sus datos."]],"trap":"","question":"Un modelo de fraude funcionaba bien, pero durante meses los patrones de compra cambian y disminuye su detección. ¿Cuál es la mejor respuesta?","options":["Subir de inmediato la confianza de todas las predicciones, sin revisar datos","Monitorear el cambio, reunir ejemplos recientes y evaluar si es necesario reentrenar","Cambiar el problema de clasificación a regresión para usar más datos","Desactivar la evaluación y confiar en el rendimiento del entrenamiento inicial"],"answer":1,"why":"MLOps implica observar el desempeño real y mejorar con datos y evaluaciones cuando cambian las condiciones.","examples":["Banco: aumenta la proporción de compras por internet (data drift) y aparecen nuevas tácticas de fraude (posible concept drift). El equipo revisa resultados recientes antes de decidir si debe actualizar el modelo.","Comercio minorista: tras abrir nuevas sucursales, cambia la demanda. El equipo registra qué versión del predictor utiliza, compara resultados, despliega una versión evaluada y puede volver a la anterior: prácticas básicas de MLOps."],"reinforcement":[{"q":"Un banco comenzó a procesar muchas más compras en línea que antes, pero todavía no sabe si bajó la precisión de su modelo. ¿Qué concepto se observa primero?","options":["Data drift, porque cambió la composición de los datos de entrada","Concept drift confirmado, porque toda compra en línea es fraude","Overfitting, porque el modelo necesariamente memorizó ejemplos","Underfitting, porque faltan iteraciones de entrenamiento"],"answer":0,"why":"Data drift describe cambios en los datos de entrada. Debemos medir si afectan el desempeño; no implica por sí solo una caída."},{"q":"Una empresa evalúa una versión mejorada de su modelo, la publica de forma controlada y conserva la versión anterior para recuperarla si falla. ¿Qué práctica está aplicando?","options":["Data cleaning, porque elimina registros repetidos","MLOps, porque gestiona versiones, despliegue y seguimiento","EDA exclusivamente, porque está explorando una base de datos","Clustering, porque agrupa versiones de modelos"],"answer":1,"why":"MLOps organiza el ciclo operativo de los modelos: versiones, despliegue, monitoreo y mantenimiento."},{"q":"Una compañía ya usa DevOps para desplegar su aplicación. Ahora desea controlar versiones del modelo, verificar su calidad con datos nuevos y actualizarlo sin interrumpir el servicio. ¿Qué práctica está incorporando?","options":["EDA, porque examina una muestra antes de entrenar","MLOps, porque amplía DevOps con operaciones de modelos y datos","Clustering, porque agrupa observaciones sin etiquetas","Batch inference, porque solo procesa registros históricos"],"answer":1,"why":"MLOps extiende las prácticas operativas de DevOps al ciclo de modelos: versionado, evaluación, despliegue, monitoreo y actualización."}]}],"quizzes":[["Una empresa quiere predecir el valor de venta de departamentos a partir de ubicación y tamaño. ¿Qué técnica encaja mejor?",["Clasificación supervisada","Regresión supervisada","Clustering no supervisado","Reinforcement learning"],1,"Es un valor numérico: regresión supervisada."],["Una tienda no tiene etiquetas de clientes y quiere descubrir segmentos de compra. ¿Qué técnica conviene?",["Regresión","Clasificación","Clustering no supervisado","Inferencia en tiempo real"],2,"Se buscan grupos sin categorías definidas: clustering."],["Un robot mejora sus acciones mediante recompensas obtenidas al recorrer un circuito. ¿Qué aprendizaje representa?",["Refuerzo","Supervisado","No supervisado","Regresión"],0,"Aprendizaje por refuerzo implica acciones y recompensas."],["Una empresa entrena un predictor de compras con datos de tiendas físicas, pero lo utilizará también con clientes que compran por internet. ¿Qué riesgo debería revisar?",["Underfitting garantizado","Necesidad de usar API propia","Cambio de la etiqueta a regresión","Sesgo por falta de diversidad de datos"],3,"Los datos no representan adecuadamente todos los canales y pueden crear sesgos."],["El conjunto de clientes contiene registros repetidos y edades mal escritas. ¿Qué etapa atiende primero esos problemas?",["Despliegue","Preparación y limpieza de datos","Inferencia en tiempo real","Reentrenamiento automático"],1,"Corregir duplicados y errores es preparación de datos."],["¿Qué conjunto usamos para comprobar el resultado final con ejemplos reservados que no guiaron el ajuste?",["Entrenamiento","Datos de producción con etiquetas visibles","Prueba (test)","Características (features)"],2,"El test se reserva para la evaluación final."],["En un detector de fraude, ¿cuál es el target?",["La clasificación histórica fraude/no fraude","Monto de transacción","Hora de compra","Canal de pago"],0,"El target es la respuesta que se busca predecir."],["Un modelo funciona muy bien con los datos usados para entrenarlo, pero mal con datos nuevos. ¿Qué ocurre?",["Convergencia ideal","Precision alta garantizada","Inferencia por lotes","Overfitting"],3,"El sobreajuste causa baja generalización."],["Una compañía necesita identificar casi todas las solicitudes fraudulentas aunque genere algunas alertas adicionales. ¿Qué prioriza?",["Precision","Recall","Accuracy","Latencia"],1,"Recall mide cuántos positivos reales fueron detectados."],["Una clínica quiere evitar alarmas positivas incorrectas porque generan procedimientos innecesarios. ¿Qué métrica atiende directamente esa prioridad?",["Recall","Accuracy","Precision","Tiempo de entrenamiento"],2,"Precision refleja la proporción de predicciones positivas correctas."],["Para transcribir grabaciones de cientos de reuniones ya almacenadas, sin respuesta inmediata, ¿qué modalidad tiene sentido?",["Procesamiento por lotes","Entrenamiento desde cero","Selección de features","Reconocimiento de objetos"],0,"Los trabajos almacenados suelen procesarse por lotes."],["Un clasificador operativo empeora tras cambiar los hábitos de los clientes. ¿Cuál acción es coherente con MLOps?",["Dejar de medir para evitar ruido","Usar solo accuracy del entrenamiento","Cambiar la clasificación por clustering sin revisar","Monitorear, revisar datos recientes y evaluar una nueva versión"],3,"MLOps implica monitoreo y mejora continua."]],"aws":[["Rekognition","Imágenes","Etiquetas, rostros, texto y moderación de imágenes"],["Textract","Documentos","Texto, formularios, tablas y datos de gastos"],["Comprehend","Lenguaje escrito","Sentimientos, entidades y frases clave"],["Polly","Texto → voz","Síntesis de voz a partir de texto"],["Translate","Traducción","Traduce texto/documentos entre idiomas"],["Transcribe","Voz → texto","Transcribe audio y voz a texto"]]};
const PHASES=DATA.phases, QUIZZES=DATA.quizzes, AWS=DATA.aws;const VISIBLE_SLIDES=[1,2,3,4,5,6,7,8,11,12];const STEPS=VISIBLE_SLIDES.length-1;let active=0;let choices={};let quizSelections={};
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=['Definir objetivo','Recolectar datos','Preparar y explorar','Seleccionar variables','Entrenar el modelo','Validar y evaluar','Desplegar e inferir','Monitorear y mejorar'];
function formatConcept(value){
  let result=esc(value);
  const terms=[
    'Datos estructurados','Datos no estructurados','Datos etiquetados','Datos sin etiquetar',
    'Representatividad','Sesgo en los datos','Parámetros','Hiperparámetros',
    'DevOps','MLOps','Latencia','Data drift','Concept drift','Training (entrenamiento)','Validation (validación)',
    'Test (prueba)','Precision','Recall','Tiempo real','Batch','Asincrónica','Serverless',
    'Rekognition','Textract','Comprehend','Polly','Translate','Transcribe',
    'Data cleaning (limpieza de datos)','Data preprocessing (preprocesamiento)',
    'Label o target','Ejemplo','Ejemplos'
  ];
  const escaped=terms.sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  const re=new RegExp('(^|[.;]\\s+)('+escaped.join('|')+'):','gi');
  result=result.replace(re,(full,pre,term)=>{
    const before=pre.trim();
    return (before ? before+'<br><br>' : '')+'<strong>'+term+':</strong> ';
  });
  return result;
}
function makeQuestion(id,q,opts,answer,why){const ch=choices[id];return `<div class="question"><div class="subtitle">COMPRUEBA TU COMPRENSIÓN</div><h3 style="margin-top:10px">${esc(q)}</h3><div class="answers">${opts.map((v,i)=>`<button type="button" class="answer ${ch===undefined?'':i===answer?'correct':i===ch?'wrong':''}" data-question="${esc(id)}" data-answer="${i}" ${ch===undefined?'':'disabled'}>${String.fromCharCode(65+i)}. ${esc(v)}</button>`).join('')}</div><div class="feedback">${ch===undefined?'Elige una opción para obtener retroalimentación inmediata.':(ch===answer?'✓ Correcto. ':'✕ Revisa la respuesta. ')+esc(why)}</div></div>`}
function render(){window.scrollTo({top:0,behavior:'instant'});const n=VISIBLE_SLIDES[active];let eyebrow='',title='',lead='',body='';
if(n===0){eyebrow='REPASO DEL CICLO';title='Ciclo de vida de ML · Segunda y última barrida';lead='Completaremos los conceptos de fundamentos de IA/ML que exige AIF-C01. Ocho fases, dos casos empresariales por fase y práctica de los conceptos nuevos, sin cálculos ni implementación técnica.';body=`<div class="card"><h2>El mapa que ya conocemos</h2><div class="grid-map">${label.map((x,i)=>`<div class="map-step"><b>0${i+1}</b><span>${x}</span></div>`).join('')}</div><p class="activityhint">Alcance: reconocimiento y selección de conceptos. Fuera de esta clase: programación de algoritmos, técnicas detalladas de transformación y cálculos.</p><p><strong>Pregunta inicial:</strong> cuando probamos Rekognition, Textract, Comprehend, Polly, Translate y Transcribe, ¿qué fase ejercitamos principalmente?</p>${makeQuestion('opening','¿Qué hicimos al enviar datos nuevos a servicios con modelos previamente entrenados?',['Realizamos inferencia','Entrenamos los modelos','Recolectamos sus datos históricos','Seleccionamos sus hiperparámetros'],0,'Usar un modelo ya entrenado con entradas nuevas es inferencia.')}</div>`;}
else if(n>=1&&n<=8){const i=n-1,p=PHASES[i];eyebrow='FASE '+n+' DE 8';title=p.title;lead=p.intro;body=`<div class="rail">${label.map((x,j)=>`<button data-go="${j+1}" class="${j+1===n?'active':''} ${j+1<n?'done':''}" title="${esc(x)}">${j+1}</button>`).join('')}</div><div class="three">${p.concepts.map((c,j)=>`<article class="card concept"><div class="num">CONCEPTO ${j+1}</div><h3 style="margin-top:12px">${esc(c[0])}</h3>${c[0]==='Tipos de tarea'?`<ul class="problem-list"><li><strong>Clasificación:</strong> predecir categorías.</li><li><strong>Regresión:</strong> predecir valores numéricos.</li><li><strong>Clustering:</strong> descubrir grupos sin etiquetas.</li></ul>`:c[0]==='Paradigmas de aprendizaje'?`<ul class="problem-list"><li><strong>Supervisado:</strong> aprende con etiquetas.</li><li><strong>No supervisado:</strong> descubre patrones sin etiquetas.</li><li><strong>Refuerzo:</strong> aprende con acciones y recompensas.</li></ul>`:`<p>${formatConcept(c[1])}</p>`}</article>`).join('')}</div><div class="two" style="margin-top:18px"><div class="callout" style="margin-top:0"><strong>Aplicación práctica · Empresa A</strong><p>${formatConcept(p.examples[0])}</p></div><div class="callout" style="margin-top:0"><strong>Aplicación práctica · Empresa B</strong><p>${formatConcept(p.examples[1])}</p></div></div>${makeQuestion('phase'+n,p.question,p.options,p.answer,p.why)}<div class="term-section"><div class="eyebrow" style="margin-top:24px">REFUERZO DE CONCEPTOS NUEVOS</div>${p.reinforcement.map((r,j)=>makeQuestion('term'+n+'_'+j,r.q,r.options,r.answer,r.why)).join('')}</div>`;}
else if(n===9){eyebrow='APLICAR LO APRENDIDO';title='¿Qué métrica responde al objetivo?';lead='Las métricas se eligen según qué error importa más. No necesitamos cálculos para entender las decisiones.';let cases=[['Detectar la mayor cantidad posible de fraudes, incluso si aparecen más alertas.', 'Recall'],['Evitar que compras legítimas sean señaladas como fraude.', 'Precision'],['Medir aciertos globales tanto en positivos como en negativos.', 'Accuracy'],['Equilibrar la detección de positivos y la calidad de las alertas positivas.', 'F1-score']];body=`<div class="three">${[['Accuracy','Aciertos en positivos y negativos'],['Precision','De los predichos positivos, cuántos son correctos'],['Recall','De los positivos reales, cuántos fueron detectados'],['F1-score','Equilibra precision y recall'],['Confianza (confidence)','Seguridad estimada de una predicción individual']].map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div><div class="card" style="margin-top:20px"><h2>Elige la métrica para cada objetivo</h2><p class="activityhint">Selecciona una respuesta en cada caso y revisa la retroalimentación.</p>${cases.map((c,j)=>makeQuestion('metric'+j,c[0],['Precision','Recall','Accuracy','F1-score'],['Precision','Recall','Accuracy','F1-score'].indexOf(c[1]),'La respuesta es '+c[1]+': '+c[0])).join('')}</div>`;}
else if(n===10){eyebrow='CONEXIÓN CON LA PRÁCTICA';title='Los seis servicios AWS en el ciclo';lead='En nuestras pruebas enviamos datos a modelos que AWS ya había entrenado: fue inferencia, no entrenamiento.';body=`<div class="three">${AWS.map((s,i)=>`<article class="card"><div class="subtitle">SERVICIO 0${i+1}</div><h3 style="margin-top:10px">Amazon ${esc(s[0])}</h3><span class="pill">${esc(s[1])}</span><p>${esc(s[2])}</p></article>`).join('')}</div><div class="callout"><strong>Relación con la certificación</strong><p>SageMaker AI permite desarrollar y administrar el ciclo de ML; los servicios administrados que probamos permiten usar modelos especializados ya entrenados. Elegimos el servicio según el problema.</p></div><div class="callout"><strong>¿Y la personalización?</strong><p>Rekognition Custom Labels, Textract Custom Queries y Comprehend Custom Classification pueden implicar entrenamiento. En Translate, terminología personalizada y datos paralelos adaptan los resultados sin que entrenemos un modelo independiente. La palabra «custom» por sí sola no significa entrenar.</p></div>${makeQuestion('service','¿Qué servicio usarías para extraer proveedor, productos y total de una factura?',['Amazon Polly','Amazon Rekognition DetectFaces','Amazon Translate','Amazon Textract AnalyzeExpense'],3,'AnalyzeExpense está especializado en facturas y recibos.')}`;}
else if(n===11){eyebrow='ACTIVIDAD FINAL';title='Reto contrarreloj de conceptos';lead='40 tarjetas en cuatro bloques de 10, con 20 segundos y cuatro opciones por tarjeta. En cada bloque se repiten solo los errores; al finalizar, un repaso acumulado reúne todas las preguntas falladas en cualquier bloque.';body=`<div class="card"><h2>Demuestra que dominas los términos nuevos</h2><p>Reconoce conceptos y toma decisiones en casos empresariales. Cada respuesta suma un punto; si fallas o se agota el tiempo, avanzarás a la siguiente tarjeta.</p><p><strong>Para completar la actividad debes obtener la nota perfecta.</strong> En cada bloque se repiten solo las preguntas falladas; al final se refuerzan los errores acumulados.</p><p><a href="03-reto-final.html" style="display:inline-block;background:#81e0ce;color:#081c28;padding:14px 20px;text-decoration:none;border-radius:11px;font-weight:800">Iniciar reto final de 4 bloques de 10</a></p></div>`;}
else{eyebrow='CIERRE';title='Cerramos el ciclo de vida';lead='Con esta segunda barrida completamos el nivel de fundamentos de ML que necesitamos para AIF-C01. No habrá una tercera barrida.';body=`<div class="card"><h2>Lo que ya podemos explicar</h2><div class="summary-rows">${[['Objetivo','Tipo de problema y costo del error'],['Datos','Fuentes, etiquetas, calidad y representatividad'],['Preparación','Limpieza, preprocesamiento, EDA y conjuntos de datos'],['Variables','Features y target, ingeniería de características'],['Entrenamiento','Parámetros, hiperparámetros, sobreajuste y subajuste'],['Evaluación','Accuracy, precision, recall, F1 y tipos de error'],['Inferencia','Tiempo real, lotes y modelos previamente entrenados'],['Monitoreo','MLOps básico, cambios en los datos y reentrenamiento']].map(x=>`<div><strong>${x[0]}</strong></div><div>${x[1]}</div>`).join('')}</div></div><div class="callout"><strong>Alcance de AIF-C01</strong><p>Debemos reconocer qué hace cada fase, qué conceptos se aplican y qué servicio corresponde a un caso. No necesitamos implementar modelos, programar pipelines, ajustar hiperparámetros ni hacer cálculos. IA generativa se estudiará en su unidad correspondiente.</p></div>`;}
$('#eyebrow').textContent=eyebrow;$('#title').textContent=title;$('#lead').textContent=lead;$('#content').innerHTML=body;$('#counter').textContent=`${active+1} / ${STEPS+1}`;$('#prev').disabled=n===0;$('#next').disabled=n===STEPS;}
function go(n){const next=VISIBLE_SLIDES.indexOf(n);if(next<0)return;active=next;render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b){go(Number(b.dataset.go));return}b=e.target.closest('[data-question]');if(b){let id=b.dataset.question;if(choices[id]!==undefined)return;choices[id]=Number(b.dataset.answer);const y=window.scrollY;render();window.scrollTo({top:y,behavior:'instant'});}});$('#prev').onclick=()=>go(VISIBLE_SLIDES[active-1]);$('#next').onclick=()=>go(VISIBLE_SLIDES[active+1]);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(VISIBLE_SLIDES[active+1]);if(e.key==='ArrowLeft')go(VISIBLE_SLIDES[active-1])});render();
</script></body></html>
