<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KrakeDev · ¿La inteligencia artificial era solo if/else?</title><link rel="stylesheet" href="../assets/style.css"><style>.heroquestion{font-size:clamp(29px,4vw,51px);font-weight:800;line-height:1.22;text-align:center;margin:65px auto;max-width:1050px}.example{padding:18px;background:#16304c;border-radius:16px;margin:14px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pill{display:inline-block;border-radius:10px;background:#1b4d75;padding:12px;margin:5px}.studentTable{width:100%;border-collapse:collapse;font-size:clamp(15px,1.7vw,23px)}.studentTable th,.studentTable td{border:1px solid #6d8dad;padding:13px;text-align:left}.studentTable th{background:#244a69}.fraud{background:#793039}.valid{background:#17604d}.picture{max-width:100%;max-height:58vh;object-fit:contain;display:block;margin:auto;border-radius:13px}.nestOuter{border:3px solid #58b7fa;border-radius:50%;min-height:330px;background:#184269;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}.nestInner{border:3px solid #dcb5ff;border-radius:50%;background:#5d3f80;padding:35px 50px;text-align:center}.bigQuestion{font-size:25px;font-weight:700;margin:12px 0}.chessIcon{font-size:95px;text-align:center}.details{line-height:1.55;font-size:20px}.lineflow{display:flex;flex-wrap:wrap;justify-content:space-around;gap:12px;margin:18px 0}.flowbox{padding:18px;border:1px solid #598bb3;border-radius:12px;background:#143453;flex:1;min-width:155px;text-align:center}.choice{display:block;width:100%;font:inherit;color:inherit;text-align:left;background:#16334e;border:1px solid #6e8bac;border-radius:10px;padding:10px 13px;margin:8px 0;cursor:pointer}.choice.sel{border:2px solid #f3cf70}.choice.right{background:#155a3d}.choice.wrong{background:#6e2937}.checking{padding:10px 22px;cursor:pointer;font-size:18px;border-radius:11px;background:#0d87c5;color:white;border:0}.qbox{margin:16px 0;padding:20px;background:#132d48;border-radius:15px}.qfeedback{font-size:16px;margin:10px 0}.mini{font-size:16px;color:#dce8ef}</style></head><body><div class="wrap"><header><div class="brand"><b>K</b>RAKEDEV <small>/ AWS AI Practitioner</small></div><nav class="nav"><a href="../index.html">☷ Índice</a><a href="08.html">← Anterior</a><a href="10.html">Siguiente →</a></nav></header><main class="stage"><h1>¿La inteligencia artificial era solo if/else?</h1><section class="card"><img class="picture" src="../assets/scooby-ai.jpg" alt="Meme proporcionado: Scooby-Doo desenmascara a IA, que resulta ser una estructura de decisiones if/else"><p class="lede">¿Un conjunto de condiciones programadas es Machine Learning? ¿Todo programa con if/else es IA?</p></section></main><footer class="foot">KrakeDev · AWS Certified AI Practitioner</footer></div><script>document.querySelectorAll('.qbox').forEach(b=>{let answer=b.dataset.answer;let selected=null;let feedback=b.querySelector('.qfeedback');b.querySelectorAll('.choice').forEach(c=>c.addEventListener('click',()=>{selected=c.dataset.value;b.querySelectorAll('.choice').forEach(x=>x.classList.toggle('sel',x===c));feedback.textContent=''}));b.querySelector('.checking').addEventListener('click',()=>{if(!selected){feedback.textContent='Elige una alternativa primero.';return;}let c=b.querySelector('[data-value="'+selected+'"]');if(selected===answer){c.classList.add('right');feedback.textContent='¡Correcto! '+b.dataset.explain}else{c.classList.add('wrong');feedback.textContent='Revisa esa opción e inténtalo nuevamente. '+c.dataset.reason;setTimeout(()=>c.classList.remove('wrong'),1600)}})})</script></body></html>
