<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{font:17px/1.5 Segoe UI,Arial,sans-serif;background:white;color:#252440;margin:0;padding:18px}h2{color:#5627ae}main{max-width:850px;margin:auto}.columns{display:grid;grid-template-columns:1fr 1.65fr;gap:16px}.terms,.defs{display:grid;gap:10px}button{font:inherit;text-align:left;cursor:pointer;border:2px solid #e1d8f6;border-radius:12px;background:#faf8ff;padding:13px;color:#292344}button:hover{border-color:#9255de}button.selected{background:#eadfff;border-color:#6b37c7}button.done{background:#e8f9ef;border-color:#38a46a}#status{margin:14px 0;padding:13px;background:#f4f0fb;border-radius:10px}#reset{text-align:center;background:#5726b2;color:#fff} @media(max-width:600px){.columns{grid-template-columns:1fr}}
</style></head><body><main><h2>Empareja los conceptos fundamentales</h2><p>Selecciona un concepto a la izquierda y su definición a la derecha.</p><div class="columns"><div class="terms" id="terms"></div><div class="defs" id="defs"></div></div><div id="status" aria-live="polite">0 de 5 relaciones.</div><button id="reset" onclick="reset()">Reiniciar actividad</button></main><script>
const items=[['FM','Modelo de IA ampliamente preentrenado que sirve como base para múltiples tareas y aplicaciones.'],['LLM','Modelo de lenguaje grande que puede generar texto, resumir, analizar o producir código.'],['Modelo multimodal','Modelo que puede trabajar con texto, imagen, audio u otras modalidades.'],['IA generativa','IA que utiliza patrones aprendidos para generar contenido nuevo.'],['Difusión','Técnica generativa que aprende a revertir progresivamente un proceso de ruido.']];
let t=null,d=null,solved=new Set();
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function reset(){t=null;d=null;solved=new Set();const term=document.getElementById('terms'),defs=document.getElementById('defs');term.replaceChildren();defs.replaceChildren();shuffle(items).forEach(x=>{const e=document.createElement('button');e.textContent=x[0];e.dataset.id=x[0];e.onclick=()=>pick('t',e,x[0]);term.append(e)});shuffle(items).forEach(x=>{const e=document.createElement('button');e.textContent=x[1];e.dataset.id=x[0];e.onclick=()=>pick('d',e,x[0]);defs.append(e)});document.getElementById('status').textContent='0 de 5 relaciones.'}
function pick(type,el,id){if(solved.has(id))return;document.querySelectorAll('#'+(type==='t'?'terms':'defs')+' button').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');if(type==='t')t=id;else d=id;if(t&&d){const ok=t===d;if(ok){solved.add(t);document.querySelectorAll('button[data-id="'+t+'"]').forEach(e=>{e.classList.remove('selected');e.classList.add('done')})}else document.querySelectorAll('.selected').forEach(e=>e.classList.remove('selected'));document.getElementById('status').textContent=ok?`Correcto · ${solved.size}/5`:'No coincide. Inténtalo nuevamente.';t=null;d=null;if(solved.size===5)document.getElementById('status').textContent='¡Excelente! Completaste las cinco relaciones.'}}
reset();
</script></body></html>
