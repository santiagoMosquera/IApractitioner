<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>¿Qué métrica necesita cada negocio? · KrakeDev</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,#1d344d,#080e19 60%);color:#eef5ff;font:17px/1.5 system-ui,Segoe UI,sans-serif}.wrap{max-width:1150px;margin:auto;padding:20px 24px 88px}header{border-bottom:1px solid #35506c;padding:15px 0;color:#dce6fb;font-weight:800}.red{color:#ff5267}.muted{color:#aebdd5}h1{font-size:clamp(30px,5vw,58px);line-height:1.12;margin:25px 0 13px}h2{font-size:27px}p{max-width:950px}.card{background:#142238;border:1px solid #344862;border-radius:17px;padding:22px;margin:16px 0}.flex{display:flex;gap:15px;flex-wrap:wrap}.tile{flex:1;min-width:170px;background:#1a2b42;border:1px solid #405b75;border-radius:14px;padding:18px}.big{font-size:34px;font-weight:850}.small{font-size:13px;color:#aabfd9}.good{color:#4fdda8}.bad{color:#ff7981}.gold{color:#ffd176}table{width:100%;border-collapse:collapse;margin:15px 0}th,td{border-bottom:1px solid #384b62;text-align:center;padding:11px 7px}th:first-child,td:first-child{text-align:left}th{color:#b8d3ec}button,select,input{background:#253e59;color:#fff;border:1px solid #6a8cac;border-radius:9px;padding:10px 12px;font:inherit}button{cursor:pointer}button:hover{background:#3c5978}input[type=number]{width:90px}input[type=range]{width:100%;accent-color:#ff5369}.grid20{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.unit{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:22px;border:1px solid #4b6078}.vp{background:#135b4d}.fn{background:#763244}.fp{background:#80541d}.vn{background:#26374f}.navbottom{position:fixed;bottom:0;left:0;right:0;background:#0b192af5;border-top:1px solid #46657c;padding:12px;display:flex;gap:15px;justify-content:center;z-index:100}.navbottom a{background:#23415e;color:white;text-decoration:none;padding:9px 14px;border-radius:10px}a{color:#9bdcff}.hidden{display:none}.hint{color:#bdd7ed;font-size:14px}.pill{display:inline-block;padding:5px 10px;background:#304a61;border-radius:30px;margin:4px}.notice{font-size:18px;padding:16px;border-left:4px solid #fd6571;background:#162b42}.action{background:#ec4f64;border:0;font-weight:bold}.mini{font-size:13px}.figure{width:100%;height:12px;background:#22334a;border-radius:20px;overflow:hidden}.fill{background:#48cda4;height:100%}@media(max-width:640px){.grid20{grid-template-columns:repeat(5,1fr)}.wrap{padding:12px 12px 86px}th,td{font-size:12px;padding:8px 3px}.big{font-size:27px}}</style></head><body><div class="wrap"><header><span class="red">K</span>RAKEDEV / AWS Certified AI Practitioner</header><h1>¿Qué métrica necesita cada negocio?</h1><p>En cada caso, selecciona la métrica que representa la prioridad señalada.</p><div class="card" id="cases"></div></div><nav class="navbottom"><a href="10b-escenarios.html">← Anterior</a><a href="../index.html">☷ Menú</a><a href="12-blooket.html">Siguiente →</a></nav><script>const cases=[["Un sensor detecta solamente 2 de los 10 incendios que realmente ocurrieron. ¿Qué métrica debe mejorar para que se le escapen menos incendios?", "Recall", "Recall mide la proporción de incendios reales detectados."], ["Una empresa clasifica 50 facturas y 50 recibos. Confundir una categoría con la otra tiene un costo similar. ¿Qué métrica priorizarías para aumentar los aciertos globales?", "Accuracy", "Accuracy cuenta las clasificaciones correctas de ambos tipos."], ["Una red social elimina automáticamente publicaciones señaladas como infractoras, pero está borrando muchas publicaciones legítimas. ¿Qué métrica debe mejorar para confiar más en sus alertas positivas?", "Precision", "Precision responde cuántas de las publicaciones marcadas como infracción realmente lo eran."], ["Una plataforma busca un solo indicador que combine qué tan confiables son sus alertas de infracción y qué proporción de infracciones reales detecta. ¿Cuál métrica utilizaría?", "F1 Score", "F1 combina Precision y Recall usando su media armónica."], ["Un banco detecta apenas 3 de los 10 fraudes que realmente ocurrieron. Aunque sus alertas suelen ser correctas, se le escapan demasiados fraudes. ¿Qué métrica debería mejorar?", "Recall", "La preocupación son los fraudes reales no identificados, llamados falsos negativos."], ["Un detector obtiene 90 % de Accuracy porque casi todas las pruebas no tienen incendio, pero deja escapar incendios reales. ¿Basta con conocer Accuracy para afirmar que es seguro?", "No", "Cuando hay desbalance de clases o distintos costos de error, Accuracy por sí sola puede ocultar fallas graves."]];document.getElementById('cases').innerHTML=cases.map((c,i)=>'<div class="card"><b>'+(i+1)+'. '+c[0]+'</b><br><select id="case'+i+'"><option value="">Selecciona tu respuesta...</option>'+(i===5?['Sí','No']:['Accuracy','Precision','Recall','F1 Score']).map(o=>'<option>'+o+'</option>').join('')+'</select> <button onclick="test('+i+')">Comprobar</button><div id="f'+i+'" class="small"></div></div>').join('');function test(i){let o=document.getElementById('case'+i).value,c=cases[i];let box=document.getElementById('f'+i);box.textContent=o===c[1]?'¡Correcto! '+c[2]:'Piensa qué tipo de error describe el caso y qué mide la opción elegida.';box.style.color=o===c[1]?'#4fdda8':'#ff7981'}</script></body></html>
