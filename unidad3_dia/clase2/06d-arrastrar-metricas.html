<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asocia cada métrica · KrakeDev</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,#1d344d,#080e19 60%);color:#eef5ff;font:17px/1.5 system-ui,Segoe UI,sans-serif}.wrap{max-width:1150px;margin:auto;padding:20px 24px 88px}header{border-bottom:1px solid #35506c;padding:15px 0;color:#dce6fb;font-weight:800}.red{color:#ff5267}.muted{color:#aebdd5}h1{font-size:clamp(30px,5vw,58px);line-height:1.12;margin:25px 0 13px}h2{font-size:27px}p{max-width:950px}.card{background:#142238;border:1px solid #344862;border-radius:17px;padding:22px;margin:16px 0}.flex{display:flex;gap:15px;flex-wrap:wrap}.tile{flex:1;min-width:170px;background:#1a2b42;border:1px solid #405b75;border-radius:14px;padding:18px}.big{font-size:34px;font-weight:850}.small{font-size:13px;color:#aabfd9}.good{color:#4fdda8}.bad{color:#ff7981}.gold{color:#ffd176}table{width:100%;border-collapse:collapse;margin:15px 0}th,td{border-bottom:1px solid #384b62;text-align:center;padding:11px 7px}th:first-child,td:first-child{text-align:left}th{color:#b8d3ec}button,select,input{background:#253e59;color:#fff;border:1px solid #6a8cac;border-radius:9px;padding:10px 12px;font:inherit}button{cursor:pointer}button:hover{background:#3c5978}input[type=number]{width:90px}input[type=range]{width:100%;accent-color:#ff5369}.grid20{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.unit{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:22px;border:1px solid #4b6078}.vp{background:#135b4d}.fn{background:#763244}.fp{background:#80541d}.vn{background:#26374f}.navbottom{position:fixed;bottom:0;left:0;right:0;background:#0b192af5;border-top:1px solid #46657c;padding:12px;display:flex;gap:15px;justify-content:center;z-index:100}.navbottom a{background:#23415e;color:white;text-decoration:none;padding:9px 14px;border-radius:10px}a{color:#9bdcff}.hidden{display:none}.hint{color:#bdd7ed;font-size:14px}.pill{display:inline-block;padding:5px 10px;background:#304a61;border-radius:30px;margin:4px}.notice{font-size:18px;padding:16px;border-left:4px solid #fd6571;background:#162b42}.action{background:#ec4f64;border:0;font-weight:bold}.mini{font-size:13px}.figure{width:100%;height:12px;background:#22334a;border-radius:20px;overflow:hidden}.fill{background:#48cda4;height:100%}@media(max-width:640px){.grid20{grid-template-columns:repeat(5,1fr)}.wrap{padding:12px 12px 86px}th,td{font-size:12px;padding:8px 3px}.big{font-size:27px}}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:16px 0}.stat{background:#1d3049;border:1px solid #4a627d;border-radius:12px;padding:16px}.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.lead{font-size:22px;color:#fff;line-height:1.38}.callout{background:#1c344b;border-left:5px solid #ff687a;border-radius:8px;padding:17px;margin:18px 0}.meta{font-size:13px;color:#a8c3dd}.badge{display:inline-block;padding:5px 10px;background:#263e59;border-radius:9px}.numbers input{width:85px}.answer{min-height:24px;margin-top:7px;font-size:14px}.vizgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.vizunit{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;border:1px solid #6b7c8e}.vp{background:#156655}.fp{background:#72501a}.fn{background:#793046}.vn{background:#26394e}.soft{font-weight:500;color:#bdd0e7}.bar{height:11px;border-radius:30px;background:#26394e;overflow:hidden}.bar>i{display:block;background:#4fdda8;height:100%}.rowimg{display:grid;grid-template-columns:125px 1fr;gap:16px;align-items:center;border-bottom:1px solid #324962;padding:12px 0}.mini-img{width:115px;height:75px;border-radius:10px;display:grid;place-items:center;background:#223c59;font-size:31px}.p-red{color:#ff6b78;font-weight:900}.choice{display:block;padding:12px;margin:6px 0;background:#1a2b42;border-radius:9px}.choice input{margin-right:12px}.tiny{font-size:13px}.stepper{display:flex;flex-wrap:wrap;gap:10px}.stepper button:disabled{opacity:.4} .code-math{font-family:ui-monospace,monospace;font-size:clamp(16px,2vw,23px);color:#fcde9b} @media(max-width:580px){.rowimg{grid-template-columns:80px 1fr}.mini-img{width:75px}}</style></head><body><div class="wrap"><header><span class="red">K</span>RAKEDEV / AWS Certified AI Practitioner</header><h1>Asocia cada métrica</h1><p>Arrastra cada frase y fórmula a la métrica correspondiente. Puedes volver a mezclar las tarjetas.</p><div class="twocol"><div class="card"><h2>Tarjetas</h2><div id="cards"></div></div><div class="card"><h2>Destinos</h2><div class="card" ondragover="event.preventDefault()" ondrop="drop(event,'RECALL')"><b>RECALL</b><div id="zone_RECALL"></div></div><div class="card" ondragover="event.preventDefault()" ondrop="drop(event,'PRECISION')"><b>PRECISION</b><div id="zone_PRECISION"></div></div><div class="card" ondragover="event.preventDefault()" ondrop="drop(event,'ACCURACY')"><b>ACCURACY</b><div id="zone_ACCURACY"></div></div></div></div><button class="action" onclick="check()">Calificar</button> <button onclick="reset()">Volver a mezclar</button><p id="fback"></p></div><nav class="navbottom"><a href="06c-tabla-comparativa.html">← Anterior</a><a href="../index.html">☷ Menú</a><a href="06b-resumen.html">Siguiente →</a></nav><script>const items=[["De las alarmas que emití, ¿cuántas eran incendios?", "PRECISION"], ["De los incendios reales, ¿cuántos detecté?", "RECALL"], ["Total de Aciertos de incendio y aciertos de normal", "ACCURACY"], ["VP / (VP + FP)", "PRECISION"], ["VP / (VP + FN)", "RECALL"], ["(VP + VN) / Total", "ACCURACY"]];let assigned={};let chosen=null;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function card(i){return '<div draggable=true ondragstart="drag(event,'+i+')" onclick="choose('+i+')" style="padding:12px;margin:7px 0;border-radius:9px;background:#233d5b;cursor:grab" id=card'+i+'>'+items[i][0]+'</div>'}function reset(){assigned={};chosen=null;document.getElementById('cards').innerHTML=shuffle(items.map((_,i)=>i)).map(card).join('');['RECALL','PRECISION','ACCURACY'].forEach(x=>document.getElementById('zone_'+x).innerHTML='');document.getElementById('fback').textContent=''}function drag(ev,i){ev.dataTransfer.setData('text/plain',i)}function choose(i){chosen=i;document.getElementById('fback').textContent='Tarjeta seleccionada. Haz clic en una métrica para colocarla.'}function drop(ev,x){ev.preventDefault();let i=ev.dataTransfer.getData('text/plain');if(i==='')i=chosen;if(i!==null && i!==undefined&&i!==''){assigned[i]=x;render()}}function render(){document.getElementById('cards').innerHTML=shuffle(items.map((_,i)=>i).filter(i=>!assigned[i])).map(card).join('');['RECALL','PRECISION','ACCURACY'].forEach(x=>document.getElementById('zone_'+x).innerHTML=Object.keys(assigned).filter(i=>assigned[i]===x).map(card).join(''))}function check(){let count=0;items.forEach((item,i)=>{let el=document.getElementById('card'+i);if(el){let ok=assigned[i]===item[1];el.style.border='2px solid '+(ok?'#4fdda8':'#ff7981');if(ok)count++}});document.getElementById('fback').textContent=count+' de 6 correctas.'}['RECALL','PRECISION','ACCURACY'].forEach(x=>document.getElementById('zone_'+x).parentNode.addEventListener('click',()=>{if(chosen!==null){assigned[chosen]=x;chosen=null;render()}}));reset();</script></body></html>
