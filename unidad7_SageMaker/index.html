<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KrakeDev · Ciclo de vida de Machine Learning · Resumen</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f3ff;background:#09101f;font-size:16px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 90% 70% at 75% 0%,#1c3557,#09101f 70%);min-height:100vh}button{font:inherit;cursor:pointer}header{display:flex;align-items:center;justify-content:space-between;gap:14px;max-width:1180px;margin:auto;padding:24px 24px 8px}header .brand{letter-spacing:.08em;font-weight:900}header .brand span{color:#ff607c}header .tag{font-size:12px;color:#adcaeb;border:1px solid #37506c;border-radius:30px;padding:7px 12px}.wrap{max-width:1180px;margin:auto;padding:18px 24px 120px}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#8fb5df;font-weight:800}h1{font-size:clamp(29px,4.5vw,49px);line-height:1.12;letter-spacing:-.035em;margin:13px 0 16px}h2{font-size:24px;letter-spacing:-.02em;margin:0 0 12px}h3{font-size:18px;margin:0 0 10px}p{color:#b9cbe0;line-height:1.65}strong{color:#f7fbff}.lead{font-size:19px;max-width:900px}.card{background:#13223a;border:1px solid #294566;border-radius:18px;padding:23px;box-shadow:0 12px 30px #0002}.muted{color:#9eb9d4}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.concept{min-height:205px}.concept p{font-size:15px;line-height:1.8}.concept p strong{color:#ffffff;font-weight:800}.term-section{margin-top:24px}.callout p{line-height:1.7}.concept .num{color:#89e6d5;font-size:12px;font-weight:850;letter-spacing:.1em}.problem-list{padding-left:20px;color:#b9cbe0;line-height:1.55;font-size:14px}.problem-list li{margin-bottom:9px}.concept-note{font-size:12px;line-height:1.5;border-top:1px solid #2c4b69;padding-top:10px}.pill{display:inline-block;border:1px solid #34516e;padding:6px 11px;border-radius:99px;color:#c7dbf0;font-size:13px;margin:3px}.callout{background:#103b44;border:1px solid #236e76;border-radius:16px;padding:18px 22px;margin-top:18px}.warning{background:#3a2b27;border-color:#765246}.question{margin-top:22px;background:#172a47;border:1px solid #39577d;padding:21px;border-radius:17px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.answer{border:1px solid #425c7a;background:#203650;color:#edf6ff;text-align:left;border-radius:12px;padding:13px 15px;min-height:59px}.answer:hover{background:#2b4c72}.answer.correct{border-color:#50ddaf;background:#185345}.answer.wrong{border-color:#e47a8e;background:#643240}.answer:disabled{cursor:default}.feedback{margin-top:13px;color:#bceade;min-height:25px}.rail{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0 27px}.rail button{border-radius:11px;border:1px solid #37526f;background:#13243c;color:#aec4de;padding:9px 11px;min-width:42px}.rail button.active{background:#346d9c;color:white;border-color:#7dbcf2}.rail button.done:not(.active){border-color:#3d857d}.grid-map{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.map-step{background:#132c49;border:1px solid #345c81;border-radius:15px;padding:15px;min-height:115px}.map-step b{display:block;color:#84dbc9;margin-bottom:10px}.map-step span{color:#eaf4ff}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1427ef;border-top:1px solid #29415e;backdrop-filter:blur(12px);padding:13px 24px;display:flex;justify-content:center;gap:14px;align-items:center;z-index:10}.navinner{width:min(1130px,100%);display:flex;gap:12px;justify-content:space-between;align-items:center}.navbutton{background:#81e0ce;color:#061b27;font-weight:800;border:none;border-radius:10px;padding:12px 20px}.navbutton.secondary{background:#213a57;color:#e2eefc}.navbutton:disabled{opacity:.35;cursor:default}.counter{font-size:13px;color:#a3bedc}.hide{display:none!important}.choice-card{border:1px solid #365271;background:#13263f;padding:15px;border-radius:13px}.service-icon{font-size:24px}.subtitle{font-weight:700;color:#86dcca;font-size:13px}.summary-rows{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:16px}.summary-rows>div{padding:13px;border-radius:9px;background:#142740}.activityhint{font-size:13px;color:#a9c3dd}footer{margin-top:34px;font-size:12px;color:#718faf}@media(max-width:740px){.two,.three,.answers{grid-template-columns:1fr}.grid-map{grid-template-columns:repeat(2,1fr)}.wrap{padding:16px 15px 130px}header{padding:18px 15px 4px}header .tag{display:none}.card{padding:16px}.nav{padding:11px 12px}.navbutton{padding:11px 13px}h1{font-size:29px}}

.phase-intro{max-width:850px}.concept{min-height:unset}.concept p{margin-bottom:0;white-space:pre-line;line-height:1.58}.three{grid-template-columns:repeat(2,minmax(0,1fr))}.concept h3{line-height:1.3}.concept:has(.leak){grid-column:1/-1}.phase-number{color:#89e6d5;font-size:12px;font-weight:800;letter-spacing:.11em}.rail button{cursor:pointer}.navbutton:focus-visible,.rail button:focus-visible{outline:3px solid #8bead9;outline-offset:3px}@media(max-width:740px){.three{grid-template-columns:1fr}.concept:has(.leak){grid-column:auto}}
</style></head><body><header><div class="brand">KRAKE<span>DEV</span> · AWS AI PRACTITIONER</div><span class="tag">Guía de repaso · 8 fases</span></header><main class="wrap"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="lead" class="lead phase-intro"></p><div class="rail" id="rail" aria-label="Seleccionar fase"></div><div id="content"></div><footer>KrakeDev · Formación en IA · Conceptos clave del ciclo de vida de Machine Learning</footer></main><div class="nav"><div class="navinner"><button class="navbutton secondary" id="prev">← Anterior</button><span class="counter" id="counter"></span><button class="navbutton" id="next">Siguiente →</button></div></div><script>
const PHASES=[{"title": "Definir el objetivo", "intro": "No comenzamos buscando un algoritmo: comenzamos identificando una decisión o problema.", "concepts": [["Problema y valor de negocio", "Identificar la decisión a mejorar, el beneficio esperado y si una predicción aporta valor frente a reglas fijas."], ["Tipos de tarea", "Clasificación: categoría; regresión: valor numérico; clustering: grupos sin categorías previas."], ["Paradigmas de aprendizaje", "Supervisado: ejemplos etiquetados; no supervisado: patrones sin etiquetas; por refuerzo: acciones y recompensas."], ["Criterio de éxito", "Definir el error más costoso y cómo evaluar el resultado antes de seleccionar la métrica."]]}, {"title": "Recolectar datos", "intro": "Los ejemplos disponibles delimitan lo que el modelo podrá aprender.", "concepts": [["Fuentes de datos", "Datos internos o externos relevantes para el problema: clientes, transacciones, sensores, documentos o imágenes."], ["Datos estructurados y no estructurados", "Estructurados: organizados en campos y columnas (CSV). Semiestructurados: organización flexible (JSON). No estructurados: imágenes, audio, video y texto libre."], ["Etiquetados y sin etiquetar", "Etiquetados: incluyen la respuesta conocida (target). Sin etiquetar: solo contienen observaciones, sin la respuesta."], ["Representatividad y sesgo", "La muestra debe reflejar los casos reales. Si ciertos grupos están poco representados, el modelo puede aprender patrones sesgados."]]}, {"title": "Preparar y explorar datos", "intro": "Antes de entrenar, comprobamos si los datos son confiables, coherentes y comparables.", "concepts": [["Data cleaning (limpieza)", "Detectar y tratar registros duplicados, valores faltantes, errores e inconsistencias. Puede incluir eliminación o imputación (media, mediana, moda)."], ["Data preprocessing (preprocesamiento)", "Preparar los datos para el modelo: corregir formatos, codificar categorías y escalar valores cuando sea necesario."], ["EDA — Exploratory Data Analysis", "Análisis exploratorio de datos: examinar distribuciones, valores atípicos, tendencias, relaciones y desequilibrios antes de entrenar."], ["Training / validation / test", "Training: el modelo aprende. Validation: se comparan y ajustan decisiones. Test: se evalúa el modelo final con datos reservados."], ["Data leakage (fuga de datos)", "Data Leakage ocurre cuando información que no debería estar disponible durante el entrenamiento influye en el modelo o en su evaluación.\n\n1. Train-Test Contamination: los datos de prueba contienen información utilizada durante el entrenamiento.\n\n2. Target Leakage: una característica revela directa o indirectamente el resultado que queremos predecir (por ejemplo, Fecha_Cancelacion para predecir churn)."]]}, {"title": "Seleccionar variables", "intro": "Las entradas útiles ayudan al modelo; las irrelevantes pueden introducir ruido y atajos.", "concepts": [["Feature (variable de entrada)", "Dato que el modelo utiliza para predecir, como minutos de llamadas o antigüedad del cliente."], ["Label o target (objetivo)", "Resultado que queremos predecir en aprendizaje supervisado, como Cancelo_Servicio."], ["Feature engineering", "Crear o transformar variables para aportar información útil. Ejemplo: Minutos_Totales = Minutos_Dia + Minutos_Tarde + Minutos_Noche."], ["Relevancia de las variables", "Feature selection: conservar variables útiles y retirar identificadores irrelevantes o características con fuga de datos."]]}, {"title": "Entrenar el modelo", "intro": "El algoritmo ajusta parámetros con ejemplos para capturar patrones que luego aplicará a datos nuevos.", "concepts": [["Algoritmo frente a modelo", "El algoritmo es el método de aprendizaje; el modelo es el resultado entrenado que aplicamos a datos nuevos."], ["Parámetros e hiperparámetros", "Parámetros: valores que el modelo aprende al entrenar. Hiperparámetros: configuraciones que controlan el aprendizaje, como iteraciones o profundidad de un árbol."], ["Overfitting (sobreajuste)", "Aprende demasiado los ejemplos de entrenamiento y falla al recibir casos nuevos."], ["Underfitting (subajuste)", "No aprende suficientemente los patrones y falla incluso en los ejemplos que debería captar."]]}, {"title": "Validar y evaluar", "intro": "No basta con que el modelo entregue una respuesta: debemos comprobar qué tipo de error comete.", "concepts": [["Accuracy", "Mide la proporción de aciertos globales, considerando positivos y negativos."], ["Precision y recall", "Precision: de las predicciones positivas, cuántas son correctas. Recall: de los positivos reales, cuántos se detectan."], ["F1-score", "Combina precision y recall, útil cuando interesa equilibrarlas; accuracy puede engañar con clases muy desbalanceadas."], ["Métricas de negocio", "Costo, tiempo, satisfacción del cliente y retorno de inversión (ROI) ayudan a comprobar si el modelo aporta valor real."]]}, {"title": "Desplegar e inferir", "intro": "El modelo pasa de las pruebas a recibir entradas nuevas en una aplicación o proceso.", "concepts": [["Inferencia", "Utilizar un modelo entrenado para generar predicciones con nuevos datos."], ["Opciones de despliegue", "Publicar un modelo en un endpoint o consumir un servicio de IA previamente entrenado mediante API."], ["Latencia y tiempo de respuesta", "Latencia: tiempo entre enviar una solicitud de predicción y recibir la respuesta."], ["Inferencia en tiempo real (real-time)", "Responde con baja latencia a cada solicitud. Ejemplo: detectar fraude durante una compra."], ["Inferencia por lotes (batch)", "Procesa muchos registros juntos, sin urgencia. Ejemplo: calcular churn de miles de clientes cada noche."], ["Inferencia asíncrona (asynchronous)", "Recibe una solicitud larga, la procesa en segundo plano y entrega el resultado después. Ejemplo: analizar un video extenso."], ["Inferencia sin servidor (serverless)", "AWS administra la infraestructura y escala según la demanda. Útil para solicitudes esporádicas; puede haber arranque en frío."], ["Cómo distinguir las cuatro modalidades", "Real-time: respuesta inmediata. Batch: muchos datos juntos. Asíncrona: trabajo largo y respuesta posterior. Serverless: infraestructura administrada y demanda variable."], ["Servicios AWS y su función", "Rekognition: imágenes. Textract: documentos. Comprehend: texto. Polly: texto a voz. Translate: traducción. Transcribe: voz a texto."]]}, {"title": "Monitorear y mejorar", "intro": "Un modelo útil hoy puede dejar de serlo si cambia el contexto o aparecen nuevos tipos de casos.", "concepts": [["Monitoreo de desempeño", "Revisar calidad de las predicciones, errores, latencia y funcionamiento del modelo en producción."], ["Cambios en los datos (drift)", "Data drift: cambia la distribución de los datos de entrada. Concept drift: cambia la relación entre entradas y resultado. Ambos pueden afectar las predicciones."], ["Reentrenamiento y mejora", "Actualizar el modelo con nuevos datos cuando sea necesario, volver a evaluarlo y desplegar una versión mejorada."], ["MLOps básico", "MLOps aplica prácticas de automatización y operación al ciclo de ML: datos, entrenamiento, versiones, despliegue y monitoreo. A diferencia de DevOps, también supervisa la calidad del modelo."]]}];let active=0;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){const p=PHASES[active];document.getElementById('eyebrow').textContent='FASE '+(active+1)+' DE 8';document.getElementById('title').textContent=p.title;document.getElementById('lead').textContent=p.intro;document.getElementById('rail').innerHTML=PHASES.map((x,i)=>`<button type="button" data-go="${i}" class="${active===i?'active':''}" title="${escapeHTML(x.title)}">${i+1}</button>`).join('');document.getElementById('content').innerHTML='<div class="three">'+p.concepts.map((c,i)=>`<article class="card concept"><div class="num">CONCEPTO ${i+1}</div><h3 style="margin-top:12px">${escapeHTML(c[0])}</h3><p class="${c[0].includes('leakage')?'leak':''}">${escapeHTML(c[1])}</p></article>`).join('')+'</div>';document.getElementById('counter').textContent=(active+1)+' / '+PHASES.length;document.getElementById('prev').disabled=active===0;document.getElementById('next').disabled=active===PHASES.length-1;}
function go(i){if(i<0||i>=PHASES.length)return;active=i;render();window.scrollTo({top:0,behavior:'instant'});}document.getElementById('prev').onclick=()=>go(active-1);document.getElementById('next').onclick=()=>go(active+1);document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(Number(b.dataset.go));});document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(active+1);if(e.key==='ArrowLeft')go(active-1)});render();
</script></body></html>
