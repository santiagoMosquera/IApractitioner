e{background:#2a668b;border-color:#79c8d5;color:#fff}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b1429ee;border-top:1px solid #294360;padding:12px 22px;backdrop-filter:blur(10px);z-index:9}.navin{max-width:1140px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;background:#83e0cd;color:#082331;font-weight:850;border-radius:10px;padding:12px 18px}.btn.secondary{background:#213a57;color:#eaf4ff}.btn:disabled{opacity:.35;cursor:not-allowed}.small{color:#a7bfd9;font-size:12px}.hero{border:1px solid #326a72;background:#133a44;border-radius:16px;padding:18px 20px;margin-top:20px}.hero p{margin:4px 0}.matching{display:grid;grid-template-columns:1fr 1fr;gap:18px}.matchcol{display:flex;flex-direction:column;gap:10px}.match{background:#18304c;border:1px solid #40617f;border-radius:11px;padding:12px;text-align:left;color:#fff;min-height:52px}.match.selected{border-color:#85e5d2;background:#235e65}.match.done{border-color:#327f72;background:#14372e;color:#99d6bc;opacity:.75}.match.wrong{border-color:#f19098;background:#653444}.instructions{padding:13px 16px;background:#112d42;border:1px solid #2e576a;border-radius:12px;margin:14px 0;color:#d1e5f4}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.option{border:1px solid #3a5877;color:#fff;background:#203750;border-radius:12px;padding:17px;text-align:left;min-height:72px}.option:hover:not(:disabled){border-color:#8bded5;background:#2c4c65}.option.correct{border-color:#66e3b1;background:#185344}.option.wrong{border-color:#f08f9c;background:#643442}.option:disabled{cursor:default}.scorebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}.counterbar{height:10px;background:#253c55;border-radius:10px;overflow:hidden;margin:12px 0}.counterfill{height:100%;background:#79dfc6;transition:width .15s linear}.timer{font-size:26px;font-weight:900;color:#8ee8d2}.timer.danger{color:#ff9a9d}.quizfoot{min-height:72px;margin-top:16px}.feedback{border-left:3px solid #85e0cd;padding:8px 14px;color:#d4f0e7;background:#123c42}.dangerbox{border-left-color:#fa96a5;background:#462b3b}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{text-align:center;background:#173047;border-radius:14px;padding:18px}.stat strong{display:block;font-size:32px}.minor{font-size:13px;color:#9ebad2}.source a{color:#9fdccf;word-break:break-word}a{color:#a1e2d4}footer{margin:24px 0;color:#7f9ab5;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.options,.matching{grid-template-columns:1fr}}@media(max-width:520px){header{padding:18px 14px 2px}.tag{display:none}.wrap{padding:16px 14px 110px}.grid{grid-template-columns:1fr}.card{padding:16px}.result{grid-template-columns:1fr 1fr}.nav{padding:10px}.btn{padding:11px 13px}}
</style></head><body><header><div class="brand">KRAKE<span>DEV</span> · AWS AI PRACTITIONER</div><span class="tag">SageMaker AI · Conceptos de certificación</span></header><main class="wrap"><div id="app"></div><footer>KrakeDev · Recurso académico interactivo · Funciona sin conexión · No se conecta con AWS ni guarda respuestas en servidores</footer></main><div class="nav"><div class="navin"><button id="back" class="btn secondary">← Anterior</button><span id="where" class="small"></span><button id="forward" class="btn">Siguiente →</button></div></div><script>
const DATA={"sections":[["01 · Plataforma y acceso","Dónde trabajamos",[["Amazon SageMaker AI","Servicio administrado de AWS para preparar datos, entrenar, evaluar, desplegar y monitorear modelos de ML.","Clave: ciclo completo de ML."],["SageMaker Studio","Entorno de trabajo web integrado para desarrollar proyectos de ML y acceder a herramientas de SageMaker AI.","Clave: entorno de desarrollo de ML."],["Dominio","Configuración que organiza usuarios, aplicaciones, permisos y recursos asociados dentro de SageMaker AI.","Clave: un dominio puede tener muchos perfiles."],["Perfil de usuario","Identidad de trabajo de una persona dentro de un dominio; permite asociar aplicaciones y configuraciones.","Contexto práctico para usar Studio; no es prioridad memorizar su configuración para AIF-C01."],["SageMaker Canvas","Interfaz visual no-code para usar modelos listos o crear modelos personalizados y generar predicciones.","Clave: ML sin programar."],["Studio vs. Canvas","Studio es el entorno amplio de desarrollo; Canvas es una aplicación visual enfocada en ML sin código.","Clave: plataforma, entorno y aplicación son niveles distintos."],["SageMaker Unified Studio","Entorno integrado de la familia SageMaker para trabajar con datos, analítica, Machine Learning e IA generativa.","Clave: datos, analítica e IA en un mismo entorno."]]],["02 · Datos y preparación","Qué recibe el modelo",[["Dataset","Conjunto de datos para entrenar, evaluar o predecir; puede contener tablas, imágenes, texto o documentos.","Clave: no significa solo CSV."],["Datos estructurados","Datos organizados en campos y filas, como una tabla de clientes.","Ejemplo: CSV de cancelación."],["Datos no estructurados","Información sin esquema tabular fijo, como imágenes, audio o documentos.","Ejemplo: fotografías."],["Feature y Target","Feature: característica de entrada. Target o label: resultado que queremos predecir.","Ejemplo: Minutos_Dia → feature; Cancelo_Servicio → target."],["Amazon S3","Almacenamiento de objetos que puede guardar datasets, modelos y resultados utilizados por SageMaker AI.","Clave: S3 almacena; SageMaker entrena."],["EDA (Exploratory Data Analysis)","Explorar los datos para conocer su distribución, relaciones, valores faltantes y posibles anomalías.","Clave: entender los datos antes de entrenar."],["Data Cleaning","Corregir o tratar datos duplicados, faltantes e inconsistentes.","Ejemplo: eliminar duplicados y completar valores."],["Data Imputation","Sustituir valores faltantes; media/mediana para números y moda para categorías, según el caso.","Clave: la estrategia depende de los datos."],["Data Wrangler","Explorar, limpiar y transformar datasets visualmente antes del entrenamiento. Ejemplo: eliminar duplicados, imputar edades faltantes y convertir categorias a números.","Certificación: preparación de datos, no búsqueda automática del mejor modelo."],["Feature Engineering","Crear o transformar características para hacer visibles patrones útiles al modelo. Ejemplo: combinar consumo_dia y consumo_noche en consumo_total, o convertir fecha_alta en antiguedad_meses.","Certificación: ingeniería de características = construir o transformar variables de entrada."],["Feature Selection","Elegir las variables que aportan información y descartar las irrelevantes, redundantes o que filtran la respuesta. Ejemplo: conservar antigüedad y reclamos; excluir número de teléfono y fecha_cancelacion.","Certificación: selección de características = decidir cuáles usar, no inventar nuevas."],["SageMaker Ground Truth","Permite crear datasets etiquetados, combinando trabajadores humanos y herramientas de ML.","Clave: etiquetado de datos."]]],["03 · Entrenar y evaluar","De los datos al modelo",[["Entrenamiento (Training)","Proceso por el que el modelo aprende patrones a partir de ejemplos.","Clave: aprender de los datos."],["AutoML / SageMaker Autopilot","Automatiza pasos de creación de modelos de ML: analiza el dataset, prepara datos, prueba algoritmos, ajusta hiperparámetros y compara modelos candidatos. Ejemplo: cargar clientes.csv, indicar cancela como target y obtener modelos evaluados para predecir cancelación, sin programar manualmente cada entrenamiento.","Certificación: Autopilot = automatizar la creación y optimización de modelos; Data Wrangler = preparación visual de los datos."],["Quick Build y Standard Build","En Canvas: Quick Build sirve para iteración rápida; Standard Build realiza una búsqueda y entrenamiento más exhaustivos.","Clave: rapidez frente a mayor exploración."],["Clasificación","Predice una categoría, como Sí/No o tipo de cliente.","Ejemplo: ¿cancelará el servicio?"],["Regresión","Predice un valor numérico continuo.","Ejemplo: precio de una vivienda."],["Pronóstico de series temporales","Predice valores futuros considerando su evolución en el tiempo.","Ejemplo: demanda mensual."],["Train / Validation / Test","Train aprende; validation ayuda a elegir o ajustar; test estima el rendimiento con ejemplos independientes.","Clave: test no debe contaminar entrenamiento."],["Overfitting y Underfitting","Overfitting (sobreajuste): rendimiento alto en entrenamiento pero malo con datos nuevos. Underfitting (subajuste): el modelo es demasiado simple y falla incluso en entrenamiento.","Certificación: distingue resultados de entrenamiento y prueba; son problemas diferentes."],["Accuracy, Precision, Recall, F1","Accuracy: porcentaje total de aciertos. Precision: de los casos predichos positivos, cuántos realmente lo eran. Recall: de los positivos reales, cuántos detectó el modelo. F1: combina precision y recall.","Ejemplo cancelación: recall alto significa detectar a la mayoría de clientes que sí iban a cancelar."],["Data Leakage","Información que no debería estar disponible influye en el entrenamiento o la evaluación.","Train-test contamination: prueba contiene datos vistos en entrenamiento. Target leakage: Fecha_Cancelacion revela el target."],["SageMaker Clarify","Ayuda a detectar posibles sesgos y explicar qué factores influyen en las predicciones.","Clave: sesgo y explicabilidad."]]],["04 · Modelos y predicción","Cómo usamos lo aprendido",[["Modelo entrenado","Resultado del aprendizaje: puede realizar predicciones con entradas nuevas.","Clave: entrenar no es lo mismo que inferir."],["Inferencia","Uso de un modelo ya entrenado para producir una predicción con datos nuevos.","Clave: predecir."],["Inferencia en tiempo real","Respuesta rápida para una solicitud individual, normalmente mediante un endpoint.","Ejemplo: detectar fraude al pagar."],["Inferencia batch","Procesar muchos registros por lotes, sin necesidad de respuesta inmediata.","Ejemplo: evaluar clientes por la noche."],["Inferencia asíncrona","La inferencia asíncrona permite procesar solicitudes que tardan más tiempo o tienen cargas grandes, sin mantener una conexión esperando una respuesta inmediata.","Ejemplo: procesar una imagen de alta resolución o un archivo grande y consultar el resultado cuando esté listo."],["Endpoint","Punto de acceso para enviar datos a un modelo desplegado y recibir predicciones.","Clave: inferencia en producción."],["Ready-to-use models en Canvas","Permiten ejecutar tareas de IA ya preparadas directamente desde Canvas, como analizar sentimientos o extraer datos de documentos, sin entrenar un modelo propio. Ejemplo: cargar reseñas y obtener su sentimiento. Se elige la tarea y se reciben resultados; no se selecciona ni administra un modelo del catálogo.","Clave: usar una capacidad preparada sin construir ni desplegar un modelo propio."],["SageMaker JumpStart","Catálogo de modelos preentrenados y soluciones para seleccionar un modelo concreto, desplegarlo y, cuando sea compatible, personalizarlo. Ejemplo: elegir un modelo de clasificación de imágenes preentrenado y adaptarlo con fotografías propias. A diferencia de Canvas Ready-to-use, aquí se trabaja con el modelo seleccionado.","Clave: elegir un modelo del catálogo para desplegar o personalizar; no solo ejecutar una tarea lista."]]],["05 · Operación y responsabilidad","Después de entrenar",[["Deployment (despliegue)","Poner un modelo a disposición de aplicaciones o usuarios para generar inferencias.","Clave: pasa del desarrollo al uso."],["MLOps","Prácticas para automatizar, desplegar, supervisar y mantener modelos de ML a lo largo del tiempo.","Clave: operación continua del ML."],["SageMaker Model Monitor","Supervisa un modelo desplegado para detectar cambios en los datos de entrada y, según la configuración y disponibilidad de etiquetas, cambios en la calidad de predicción. Ejemplo: alertar si los clientes actuales tienen patrones muy diferentes a los usados al entrenar.","Clave: vigilancia operativa después del despliegue; no vuelve a entrenar por sí solo."],["Data Drift","Cambios en la distribución de datos que llegan al modelo respecto a los de referencia.","Clave: cambian los datos."],["SageMaker Pipelines","Orquesta y automatiza pasos conectados del proceso de ML, como preparar datos, entrenar, evaluar y registrar un modelo. Ejemplo: cuando llega una nueva versión del dataset, ejecutar el flujo de entrenamiento y evaluación en el orden definido.","Clave: automatiza el flujo de trabajo, no es una colección de modelos."],["SageMaker Feature Store","Repositorio central para guardar, compartir y reutilizar características (features) de ML, con consistencia entre entrenamiento e inferencia. Ejemplo: conservar antigüedad, promedio de pagos y número de reclamos del cliente para que varios modelos utilicen esas mismas variables.","Clave: catálogo reutilizable de características, no de modelos completos."],["SageMaker Model Registry","Permite registrar versiones de modelos, sus metadatos y su estado de aprobación antes del despliegue. Ejemplo: comparar la versión 1 con la versión 2 del predictor de cancelación y aprobar únicamente la que pasó las pruebas.","Clave: registra versiones y aprobaciones del modelo."],["SageMaker Model Cards","Ficha de documentación de un modelo: para qué se creó, datos utilizados, métricas, límites y riesgos conocidos. Ejemplo: documentar que un predictor de cancelación se probó con datos históricos y puede ser menos preciso con clientes nuevos.","Clave: explica cómo usar responsablemente un modelo y cuáles son sus límites."],["IAM y rol de ejecución","IAM controla permisos; el rol de ejecución autoriza acciones de SageMaker sobre otros recursos, como S3.","Clave: mínimo privilegio."],["Costos y recursos activos","Instancias, entrenamiento, almacenamiento y endpoints pueden producir cargos. Cerrar una pestaña no garantiza detener recursos.","Clave: apagar lo que no se utiliza."]]],["06 · Decisiones de examen","Qué servicio corresponde",[["SageMaker AI vs SageMaker Studio","SageMaker AI ofrece capacidades de ML; SageMaker Studio es el entorno web donde utilizamos muchas de ellas.","Clave: servicio frente a entorno."],["Canvas vs Autopilot","Canvas: interfaz visual sin código para el usuario. Autopilot: automatiza tareas de creación y optimización de modelos.","Clave: interfaz frente a automatización."],["JumpStart vs Ground Truth","JumpStart: modelos preentrenados y ejemplos. Ground Truth: etiquetar datos.","Clave: reutilizar modelos vs preparar etiquetas."],["Clarify vs Model Monitor","Clarify: sesgos y explicaciones. Model Monitor: supervisión de calidad y cambios en producción.","Clave: responsabilidad vs vigilancia operativa."]]]],"questions":[["Una empresa quiere entrenar, evaluar y desplegar modelos de ML utilizando servicios administrados de AWS. ¿Cuál servicio corresponde?",["Amazon SageMaker AI","Amazon S3","Amazon CloudWatch","AWS IAM"],0,"Amazon SageMaker AI proporciona capacidades para preparar datos, entrenar, evaluar, desplegar y monitorear modelos de Machine Learning."],["Un científico de datos necesita un entorno web para acceder a las herramientas de desarrollo de ML. ¿Qué utilizaría?",["SageMaker Canvas","SageMaker Studio","Amazon S3","Amazon CloudWatch"],1,"SageMaker Studio es el entorno integrado web para desarrollar proyectos de Machine Learning. Canvas se orienta al uso visual sin código."],["Una empresa necesita que analistas de negocio construyan un modelo de predicción sin programar. ¿Qué herramienta elegirías?",["SageMaker Studio","Amazon SageMaker AI","SageMaker Canvas","Amazon S3"],2,"SageMaker Canvas ofrece una interfaz visual sin código para crear modelos personalizados y generar predicciones."],["¿Cuál afirmación describe correctamente la diferencia entre SageMaker Studio y SageMaker Canvas?",["Studio es almacenamiento; Canvas es un servicio de seguridad","Studio se orienta al desarrollo de ML; Canvas al trabajo visual sin código","Studio solo sirve para inferencia batch; Canvas solo para entrenamiento con código","Studio y Canvas se utilizan exclusivamente para almacenar archivos"],1,"Studio es un entorno integrado de desarrollo de ML. Canvas es una aplicación visual para utilizar y construir modelos sin escribir código."],["Un equipo quiere preparar datos, entrenar modelos y después ponerlos en producción usando capacidades de AWS. ¿Cuál es el servicio que cubre ese ciclo de ML?",["SageMaker Canvas","SageMaker Unified Studio","Amazon SageMaker AI","Amazon S3"],2,"SageMaker AI reúne capacidades del ciclo de vida de Machine Learning, desde la preparación hasta el despliegue y el monitoreo."],["¿Cuál herramienta elegirías para probar predicciones mediante una interfaz visual, sin escribir código?",["Amazon S3","SageMaker Canvas","SageMaker Studio","AWS IAM"],1,"Canvas permite usar modelos listos o construir modelos personalizados mediante una interfaz visual sin código."],["¿Qué entorno de la familia SageMaker integra datos, analítica, Machine Learning e IA generativa?",["SageMaker Canvas","SageMaker Studio","SageMaker Unified Studio","Amazon S3"],2,"SageMaker Unified Studio integra experiencias de trabajo con datos, analítica, Machine Learning e IA generativa."],["Una analista tiene un archivo con datos de clientes y quiere construir un predictor mediante pasos visuales. ¿Dónde empezaría?",["SageMaker Canvas","Amazon CloudWatch","AWS IAM","Amazon S3"],0,"Canvas está enfocado en los usuarios que desean desarrollar modelos de ML usando una interfaz visual sin escribir código."],["Un desarrollador necesita un espacio web para trabajar con herramientas de desarrollo de modelos. ¿Cuál es la mejor elección?",["SageMaker Canvas","SageMaker Studio","Amazon S3","SageMaker Unified Studio"],1,"SageMaker Studio es el entorno web integrado dedicado al desarrollo de Machine Learning."],["Una organización trabaja conjuntamente con datos, herramientas de analítica y proyectos de IA generativa. ¿Qué entorno integrado encaja mejor?",["SageMaker Canvas","Amazon SageMaker AI","SageMaker Unified Studio","Amazon S3"],2,"SageMaker Unified Studio busca reunir datos, analítica, ML e IA generativa en un entorno integrado."],["En un dataset para predecir cancelaciones, ¿qué representa la columna «cancela»?",["Target (etiqueta)","Feature Engineering","Data Wrangler","Feature Store"],0,"La etiqueta o target es el valor que el modelo aprende a predecir; las características son las entradas."],["A partir de «fecha_alta» calculas «antiguedad_meses» para entrenar el modelo. ¿Qué técnica aplicaste?",["Feature Engineering","Feature Selection","Model Monitor","Ground Truth"],0,"Creaste una variable nueva a partir de datos existentes: esto es ingeniería de características."],["Excluyes «numero_telefono» porque no aporta valor predictivo. ¿Qué proceso realizaste?",["Feature Selection","Feature Engineering","Autopilot","Data Leakage"],0,"Seleccionar características consiste en escoger entradas útiles y descartar las irrelevantes."],["Antes de entrenar, quieres imputar edades, eliminar duplicados y transformar columnas visualmente. ¿Qué herramienta utilizarías?",["SageMaker Data Wrangler","SageMaker JumpStart","SageMaker Model Registry","SageMaker Model Monitor"],0,"Data Wrangler ayuda a preparar, limpiar y transformar datos; no automatiza por sí mismo todo el entrenamiento."],["Una columna contiene la fecha de cancelación, conocida solo después de que el cliente cancela. ¿Qué riesgo genera?",["Target Leakage","Feature Selection","Data Drift","Data Imputation"],0,"La columna revela el resultado futuro que se intenta predecir y distorsiona el entrenamiento."],["El dataset presenta algunos valores faltantes de «ingreso_mensual». ¿Qué técnica puede reemplazarlos por una mediana apropiada?",["Data Imputation","Ground Truth","Model Registry","Inferencia batch"],0,"La imputación sustituye datos ausentes mediante una estrategia justificada."],["Quieres analizar distribuciones y valores atípicos antes de entrenar. ¿Qué actividad corresponde?",["EDA (análisis exploratorio de datos)","Deployment","Model Registry","Inferencia en tiempo real"],0,"EDA permite conocer y evaluar la calidad del conjunto de datos."],["Necesitas almacenar los CSV que se utilizarán en entrenamiento de SageMaker. ¿Qué servicio corresponde?",["Amazon S3","SageMaker Clarify","SageMaker Model Cards","SageMaker Feature Store"],0,"Amazon S3 almacena objetos como datasets; SageMaker realiza los procesos de ML."],["Tienes miles de fotografías sin etiquetas para clasificación supervisada. ¿Qué servicio ayuda a etiquetarlas?",["SageMaker Ground Truth","SageMaker JumpStart","SageMaker Autopilot","SageMaker Model Monitor"],0,"Ground Truth se usa para crear datos etiquetados para el entrenamiento."],["Guardas «antiguedad_meses» para reutilizarla entre varios modelos y mantener consistencia en inferencia. ¿Qué servicio corresponde?",["SageMaker Feature Store","SageMaker Model Registry","SageMaker JumpStart","SageMaker Model Cards"],0,"Feature Store centraliza características reutilizables, no versiones de modelos."],["Un modelo tiene 99 % de aciertos en entrenamiento, pero solo 65 % en datos nunca vistos. ¿Qué problema presenta?",["Overfitting (sobreajuste)","Underfitting (subajuste)","Data Imputation","Feature Selection"],0,"Aprendió demasiado los patrones particulares de entrenamiento y no generaliza bien."],["Un modelo demasiado simple obtiene malos resultados tanto en entrenamiento como en prueba. ¿Qué problema presenta?",["Underfitting (subajuste)","Overfitting (sobreajuste)","Data Drift","Target Leakage"],0,"No logra aprender patrones suficientes ni siquiera sobre los datos de entrenamiento."],["En SageMaker Autopilot cargas clientes.csv y seleccionas «cancela» como objetivo. ¿Qué puede automatizar?",["Preparación, prueba de algoritmos y ajuste de modelos candidatos","Solo etiquetado humano de fotografías","Únicamente supervisión de endpoints activos","Solo almacenamiento de datasets en S3"],0,"Autopilot es AutoML: automatiza pasos del proceso para construir y optimizar modelos."],["Quieres comparar automáticamente varios enfoques de ML y sus hiperparámetros sin programar cada experimento. ¿Qué servicio conviene?",["SageMaker Autopilot","SageMaker Ground Truth","SageMaker Model Cards","SageMaker Model Monitor"],0,"Autopilot prueba configuraciones y produce modelos candidatos que pueden compararse."],["¿Qué diferencia hay entre Data Wrangler y Autopilot?",["Data Wrangler prepara datos; Autopilot automatiza creación y optimización de modelos","Ambos se dedican exclusivamente a desplegar endpoints","Data Wrangler monitorea drift y Autopilot documenta riesgos","Autopilot solo etiqueta datos y Data Wrangler registra modelos"],0,"En el examen importa identificar la etapa del ciclo de ML cubierta por cada herramienta."],["Al separar un dataset en entrenamiento, validación y prueba, ¿para qué sirve el conjunto de prueba?",["Estimar desempeño final con ejemplos no utilizados para entrenar o ajustar","Entrenar los pesos del modelo","Elegir hiperparámetros repetidamente","Crear las etiquetas originales"],0,"La prueba debe ser independiente para estimar generalización y evitar contaminación."],["Quieres predecir si un cliente cancelará el servicio (sí/no). ¿Qué problema es?",["Clasificación","Regresión","Pronóstico de series temporales","Clustering"],0,"Clasificación predice categorías, como sí o no."],["Quieres predecir el importe mensual que gastará un cliente. ¿Qué problema es?",["Regresión","Clasificación","Etiquetado supervisado","Análisis de sesgo"],0,"Regresión predice una magnitud numérica continua."],["De 100 clientes que realmente cancelaron, el modelo detectó 85. ¿Cuál es el recall para la clase «cancela»?",["85 %","15 %","100 %","No puede calcularse con estos datos"],0,"Recall = positivos verdaderos detectados / todos los positivos reales = 85/100."],["De 40 clientes que el modelo marcó como «cancelará», 30 cancelaron realmente. ¿Cuál es la precision para esa clase?",["75 %","30 %","40 %","90 %"],0,"Precision = verdaderos positivos / todos los predichos positivos = 30/40 = 75 %."],["Al clasificar cancelaciones, hay pocos positivos y quieres equilibrar precision y recall en una sola métrica. ¿Cuál utilizarías?",["F1-score","Accuracy","Error cuadrático medio","R cuadrado"],0,"F1 es la media armónica de precision y recall; resume ambas, aunque no reemplaza su análisis individual."],["¿Qué servicio ayuda a analizar sesgos en datos o modelos y a explicar predicciones?",["SageMaker Clarify","SageMaker Ground Truth","SageMaker Model Monitor","SageMaker JumpStart"],0,"Clarify trabaja con sesgo y explicabilidad; Model Monitor supervisa aspectos de modelos desplegados."],["Un modelo usa «fecha_cancelacion» como predictor para saber quién cancelará en el futuro. ¿Cuál es el problema?",["Target Leakage","Underfitting","Feature Engineering","Data Drift"],0,"Se está usando información vinculada al resultado que no estaría disponible al predecir."],["¿Cómo llamamos al resultado del entrenamiento que ya puede usarse?",["Modelo entrenado","Inferencia asíncrona","Endpoint","Inferencia"],0,"Resultado del aprendizaje: puede realizar predicciones con entradas nuevas. Clave: entrenar no es lo mismo que inferir."],["¿Qué nombre tiene producir predicciones con un modelo entrenado?",["Inferencia","Inferencia batch","Inferencia asíncrona","Inferencia en tiempo real"],0,"Uso de un modelo ya entrenado para producir una predicción con datos nuevos. Clave: predecir."],["Un pago necesita una respuesta en segundos. ¿Qué tipo de inferencia conviene?",["Inferencia en tiempo real","SageMaker JumpStart","Ready-to-use models en Canvas","Inferencia asíncrona"],0,"Respuesta rápida para una solicitud individual, normalmente mediante un endpoint. Ejemplo: detectar fraude al pagar."],["Una empresa puntúa 50 000 clientes durante la noche. ¿Qué tipo de inferencia conviene?",["Inferencia batch","Ready-to-use models en Canvas","SageMaker JumpStart","Modelo entrenado"],0,"Procesar muchos registros por lotes, sin necesidad de respuesta inmediata. Ejemplo: evaluar clientes por la noche."],["Una solicitud tarda bastante en procesarse. ¿Qué opción de inferencia admite espera?",["Inferencia asíncrona","Endpoint","Inferencia","Inferencia batch"],0,"La inferencia asíncrona permite procesar solicitudes que tardan más tiempo o tienen cargas grandes, sin mantener una conexión esperando una respuesta inmediata. Ejemplo: procesar una imagen de alta resolución o un archivo grande y consultar el resultado cuando esté listo."],["¿Qué punto recibe solicitudes para un modelo desplegado?",["Endpoint","Inferencia asíncrona","Inferencia","SageMaker JumpStart"],0,"Punto de acceso para enviar datos a un modelo desplegado y recibir predicciones. Clave: inferencia en producción."],["Subes reseñas y obtienes sentimientos sin entrenar un modelo. ¿Qué usarías?",["Ready-to-use models en Canvas","Modelo entrenado","Inferencia batch","Inferencia en tiempo real"],0,"Permiten ejecutar tareas de IA ya preparadas directamente desde Canvas, como analizar sentimientos o extraer datos de documentos, sin entrenar un modelo propio. Ejemplo: cargar reseñas y obtener su sentimiento. Se elige la tarea y se reciben resultados; no se selecciona ni administra un modelo del catálogo. Clave: usar una capacidad preparada sin construir ni desplegar un modelo propio."],["Quieres escoger un modelo preentrenado y adaptarlo. ¿Qué usarías?",["SageMaker JumpStart","Ready-to-use models en Canvas","Modelo entrenado","Inferencia asíncrona"],0,"Catálogo de modelos preentrenados y soluciones para seleccionar un modelo concreto, desplegarlo y, cuando sea compatible, personalizarlo. Ejemplo: elegir un modelo de clasificación de imágenes preentrenado y adaptarlo con fotografías propias. A diferencia de Canvas Ready-to-use, aquí se trabaja con el modelo seleccionado. Clave: elegir un modelo del catálogo para desplegar o personalizar; no solo ejecutar una tarea lista."],["¿Qué opción ejecuta tareas de IA preparadas directamente desde Canvas?",["Ready-to-use models en Canvas","Endpoint","Inferencia asíncrona","Inferencia en tiempo real"],0,"Permiten ejecutar tareas de IA ya preparadas directamente desde Canvas, como analizar sentimientos o extraer datos de documentos, sin entrenar un modelo propio. Ejemplo: cargar reseñas y obtener su sentimiento. Se elige la tarea y se reciben resultados; no se selecciona ni administra un modelo del catálogo. Clave: usar una capacidad preparada sin construir ni desplegar un modelo propio."],["¿Dónde encuentras modelos preentrenados que puedes desplegar o personalizar?",["SageMaker JumpStart","Ready-to-use models en Canvas","Inferencia batch","Inferencia en tiempo real"],0,"Catálogo de modelos preentrenados y soluciones para seleccionar un modelo concreto, desplegarlo y, cuando sea compatible, personalizarlo. Ejemplo: elegir un modelo de clasificación de imágenes preentrenado y adaptarlo con fotografías propias. A diferencia de Canvas Ready-to-use, aquí se trabaja con el modelo seleccionado. Clave: elegir un modelo del catálogo para desplegar o personalizar; no solo ejecutar una tarea lista."],["¿Cómo se llama poner un modelo a disposición de otras aplicaciones?",["Deployment (despliegue)","MLOps","SageMaker Model Registry","Data Drift"],0,"Poner un modelo a disposición de aplicaciones o usuarios para generar inferencias. Clave: pasa del desarrollo al uso."],["¿Qué disciplina administra el ML durante su operación continua?",["MLOps","SageMaker Feature Store","IAM y rol de ejecución","SageMaker Model Registry"],0,"Prácticas para automatizar, desplegar, supervisar y mantener modelos de ML a lo largo del tiempo. Clave: operación continua del ML."],["¿Qué servicio detecta cambios en datos o desempeño tras desplegar?",["SageMaker Model Monitor","SageMaker Model Cards","SageMaker Feature Store","Deployment (despliegue)"],0,"Supervisa un modelo desplegado para detectar cambios en los datos de entrada y, según la configuración y disponibilidad de etiquetas, cambios en la calidad de predicción. Ejemplo: alertar si los clientes actuales tienen patrones muy diferentes a los usados al entrenar. Clave: vigilancia operativa después del despliegue; no vuelve a entrenar por sí solo."],["¿Cómo se llaman los cambios en la distribución de datos de entrada?",["Data Drift","SageMaker Model Registry","SageMaker Model Monitor","SageMaker Feature Store"],0,"Cambios en la distribución de datos que llegan al modelo respecto a los de referencia. Clave: cambian los datos."],["¿Qué servicio automatiza preparar, entrenar, evaluar y registrar en secuencia?",["SageMaker Pipelines","Costos y recursos activos","IAM y rol de ejecución","SageMaker Model Cards"],0,"Orquesta y automatiza pasos conectados del proceso de ML, como preparar datos, entrenar, evaluar y registrar un modelo. Ejemplo: cuando llega una nueva versión del dataset, ejecutar el flujo de entrenamiento y evaluación en el orden definido. Clave: automatiza el flujo de trabajo, no es una colección de modelos."],["¿Dónde guardarías las variables reutilizables de varios modelos?",["SageMaker Feature Store","SageMaker Model Cards","MLOps","IAM y rol de ejecución"],0,"Repositorio central para guardar, compartir y reutilizar características (features) de ML, con consistencia entre entrenamiento e inferencia. Ejemplo: conservar antigüedad, pro const CONCEPT_HIGHLIGHTS={"Amazon SageMaker AI":"preparar datos, entrenar, evaluar, desplegar y monitorear modelos","SageMaker Studio":"Entorno de trabajo web integrado","Dominio":"organiza usuarios, aplicaciones, permisos y recursos","Perfil de usuario":"Identidad de trabajo de una persona dentro de un dominio","SageMaker Canvas":"Interfaz visual no-code","Studio vs. Canvas":"Canvas es una aplicación visual enfocada en ML sin código","SageMaker Unified Studio":"datos, analítica, Machine Learning e IA generativa","Dataset":"Conjunto de datos para entrenar, evaluar o predecir","Datos estructurados":"organizados en campos y filas","Datos no estructurados":"sin esquema tabular fijo","Feature y Target":"resultado que queremos predecir","Amazon S3":"Almacenamiento de objetos","EDA (Exploratory Data Analysis)":"conocer su distribución, relaciones, valores faltantes y posibles anomalías","Data Cleaning":"datos duplicados, faltantes e inconsistentes","Data Imputation":"Sustituir valores faltantes","Data Wrangler":"explorar, limpiar, preparar y transformar datasets","Feature Engineering":"Crear o transformar variables","Feature Selection":"Seleccionar características útiles","SageMaker Ground Truth":"crear datasets etiquetados","Entrenamiento (Training)":"aprende patrones a partir de ejemplos","AutoML / SageMaker Autopilot":"Automatiza tareas como preparar datos, seleccionar algoritmos, entrenar y ajustar modelos","Quick Build y Standard Build":"Quick Build sirve para iteración rápida","Clasificación":"Predice una categoría","Regresión":"Predice un valor numérico continuo","Pronóstico de series temporales":"Predice valores futuros considerando su evolución en el tiempo","Train / Validation / Test":"test estima el rendimiento con ejemplos independientes","Overfitting y Underfitting":"memoriza demasiado y generaliza mal","Accuracy, Precision, Recall, F1":"recall: positivos reales detectados","Data Leakage":"Información que no debería estar disponible influye en el entrenamiento o la evaluación","SageMaker Clarify":"detectar posibles sesgos y explicar qué factores influyen en las predicciones","Modelo entrenado":"realizar predicciones con entradas nuevas","Inferencia":"producir una predicción con datos nuevos","Inferencia en tiempo real":"Respuesta rápida para una solicitud individual","Inferencia batch":"Procesar muchos registros por lotes","Inferencia asíncrona":"solicitudes largas o grandes sin esperar respuesta inmediata","Endpoint":"Punto de acceso para enviar datos a un modelo desplegado y recibir predicciones","Ready-to-use models en Canvas":"realizar tareas de IA ya preparadas","SageMaker JumpStart":"seleccionar un modelo, desplegarlo y, si es compatible, personalizarlo","Deployment (despliegue)":"Poner un modelo a disposición de aplicaciones o usuarios","MLOps":"automatizar, desplegar, supervisar y mantener modelos de ML","SageMaker Model Monitor":"Supervisa un modelo desplegado","Data Drift":"Cambios en la distribución de datos","SageMaker Pipelines":"Orquesta y automatiza pasos conectados","SageMaker Feature Store":"guardar, compartir y reutilizar características","SageMaker Model Registry":"registrar versiones de modelos","SageMaker Model Cards":"Ficha de documentación de un modelo","IAM y rol de ejecución":"el rol de ejecución autoriza acciones de SageMaker sobre otros recursos","Costos y recursos activos":"pueden producir cargos","SageMaker AI vs SageMaker Studio":"SageMaker AI ofrece capacidades de ML; SageMaker Studio es el entorno web","Canvas vs Autopilot":"Autopilot: automatiza tareas de creación y optimización de modelos","JumpStart vs Ground Truth":"Ground Truth: etiquetar datos","Clarify vs Model Monitor":"Model Monitor: supervisión de calidad y cambios en producción"};
function highlight(text,title){
  const phrase=CONCEPT_HIGHLIGHTS[title];
  if(!phrase || !text.includes(phrase))return escape(text);
  const at=text.indexOf(phrase);
  return escape(text.slice(0,at))+'<span class="key">'+escape(phrase)+'</span>'+escape(text.slice(at+phrase.length));
}
function header(k,title,lead){return `<div class="eyebrow">${k}</div><h1>${title}</h1><p class="lead">${lead}</p>`}
const TOTAL_STAGES=MATCH_BLOCKS+DATA.sections.length*2;
let quizSection=0,quizDone=new Set(),quizPending=new Set(),quizFirst={},quizAttempts={},questionAnswered=false;
function sectionForStage(z){return Math.floor((z-MATCH_BLOCKS)/2)}
function isQuizStage(z){return z>=MATCH_BLOCKS&&((z-MATCH_BLOCKS)%2===1)}
function render(){clearInterval(clock);clock=null;window.scrollTo({top:0,behavior:'instant'});let s='';
if(stage<MATCH_BLOCKS){const b=stage,block=DATA.matchBlocks[b];s=header('ACTIVIDAD INICIAL · BLOQUE '+(b+1)+' DE '+MATCH_BLOCKS,b===0?'Empareja herramientas para construir modelos':'Empareja gestión y seguimiento de modelos','Relaciona 7 términos clave con su función. Después revisarás sus explicaciones y ejemplos.');s+=`<div class="instructions">Selecciona un término de la izquierda y su significado de la derecha. Las respuestas correctas quedan marcadas. Puedes volver a intentar sin penalización.</div><div class="matching"><div class="matchcol"><h3>Conceptos (${block.length})</h3>${block.map((x,i)=>`<button class="match ${matched[b].has(i)?'done':''} ${left===i?'selected':''}" data-left="${i}" ${matched[b].has(i)?'disabled':''}>${escape(x[0])}</button>`).join('')}</div><div class="matchcol"><h3>Significados</h3>${rightOrder[b].map(i=>`<button class="match ${matched[b].has(i)?'done':''} ${right===i?'selected':''}" data-right="${i}" ${matched[b].has(i)?'disabled':''}>${escape(block[i][1])}</button>`).join('')}</div></div><div class="hero"><strong>${matched[b].size} / ${block.length} parejas correctas</strong><p>${matched[b].size===block.length?'¡Bloque completado! Continúa con el siguiente.':'Intentos incorrectos: '+matchMistakes[b]+'. El objetivo es descubrir, no memorizar todavía.'}</p></div>`}
else if(!isQuizStage(stage)){let idx=sectionForStage(stage),[ey,title,concepts]=DATA.sections[idx];s=header(ey,title,'Identifica en celeste los conceptos específicos de SageMaker. Los fundamentos generales de ML permanecen en blanco. Después de esta sección tendrás tarjetas cronometradas para reforzar los conceptos.');s+=`<div class="rail">${DATA.sections.map((sec,i)=>`<button data-stage="${MATCH_BLOCKS+i*2}" class="${stage===MATCH_BLOCKS+i*2?'active':''}">${i+1}. ${escape(sec[1])}</button>`).join('')}</div><div class="legend"><i></i> Celeste: conceptos nuevos de SageMaker. Naranja: palabras o frases clave. Blanco: fundamentos de ML.</div><div class="grid">${concepts.map(([t,d,n])=>`<article class="card concept"><p class="definition"><strong class="${NEW_SAGEMAKER.has(t)?'new-service':''}">${escape(t)}:</strong> ${highlight(d,t)}</p><div class="exam">${escape(n).replace(/^([^:]+:)/,'<strong>$1</strong>')}</div></article>`).join('')}</div>`;if(idx===2)s+=`<div class="hero"><strong>Data Leakage: dos casos que debes distinguir</strong><p><b>Train-Test Contamination:</b> los datos de prueba incluyen información utilizada en el entrenamiento.</p><p><b>Target Leakage:</b> una característica revela el resultado futuro; por ejemplo, <b>Fecha_Cancelacion</b> al predecir cancelación.</p></div>`;if(idx===3)s+=`<div class="hero"><strong>Canvas Ready-to-use frente a JumpStart</strong><p><b>Canvas Ready-to-use:</b> seleccionas una tarea ya preparada y obtienes resultados, como el sentimiento de 100 reseñas, sin entrenar tu propio modelo.</p><p><b>JumpStart:</b> eliges un modelo preentrenado del catálogo para desplegarlo o, si el modelo lo permite, personalizarlo con tus datos.</p><p><b>Importante:</b> Canvas también puede integrarse con modelos de JumpStart; la diferencia aquí es el tipo de trabajo que realizas.</p></div>`}
else{quizSection=sectionForStage(stage);s=header('TARJETAS · BLOQUE '+(quizSection+1)+' DE 6',quizSection===5?'Cierre: servicios y herramientas de SageMaker':'Comprueba lo aprendido: '+DATA.sections[quizSection][1],QUIZ_COUNTS[quizSection]+' tarjetas · 20 segundos por pregunta · retroalimentación inmediata · repaso de errores.');s+='<div id="quiz"></div>'}
$('#app').innerHTML=s;$('#back').disabled=stage===0;$('#forward').disabled=(stage<MATCH_BLOCKS&&matched[stage].size<DATA.matchBlocks[stage].length)||(isQuizStage(stage)&&!quizDone.has(sectionForStage(stage)))||stage===TOTAL_STAGES-1;$('#where').textContent=stage<MATCH_BLOCKS?'Emparejar '+(stage+1)+' / '+MATCH_BLOCKS:isQuizStage(stage)?'Tarjetas '+(sectionForStage(stage)+1)+' / 6':'Conceptos '+(sectionForStage(stage)+1)+' / 6';if(isQuizStage(stage))renderQuizHome()}
function change(n){if(n<0||n>=TOTAL_STAGES)return;if(stage<MATCH_BLOCKS&&matched[stage].size<DATA.matchBlocks[stage].length&&n>stage)return;if(isQuizStage(stage)&&!quizDone.has(sectionForStage(stage))&&n>stage)return;stage=n;left=null;right=null;render()}
function tryMatch(){if(left===null||right===null)return;const b=stage;if(left===right)matched[b].add(left);else matchMistakes[b]++;left=null;right=null;render()}
function renderQuizHome(){let done=quizDone.has(quizSection);$('#quiz').innerHTML=`<div class="card"><h2>${done?'Bloque superado':QUIZ_COUNTS[quizSection]+' preguntas con cronómetro'}</h2><p>Responde cada tarjeta en un máximo de 20 segundos. Si fallas o se agota el tiempo, volverás a encontrar esa pregunta en el repaso.</p><div class="hero"><strong>${done?'Ya completaste todas las preguntas de este bloque.':'Reglas del bloque'}</strong><p>4 opciones · respuesta y explicación inmediata · repaso de errores.</p></div><p><button id="start" class="btn">${done?'Repetir este bloque':'Iniciar las '+QUIZ_COUNTS[quizSection]+' tarjetas →'}</button></p></div>`}
function start(){quizSection=sectionForStage(stage);round=shuffle(Array.from({length:QUIZ_COUNTS[quizSection]},(_,i)=>QUIZ_STARTS[quizSection]+i));pos=0;answered=false;quizPending=new Set();quizFirst={};quizAttempts={};drawQuestion()}
function drawQuestion(){clearInterval(clock);if(pos>=round.length){drawResults();return}let qi=round[pos],q=DATA.questions[qi];answered=false;remaining=20;let opts=shuffle(q[1].map((v,i)=>({label:v,correct:i===q[2]})));let html=`<div class="scorebar"><span class="pill">Tarjeta ${pos+1} / ${round.length}</span><span class="pill">Bloque ${quizSection+1} de 6</span><span class="pill">Por repasar: ${quizPending.size}</span><span class="timer" id="timer">20 s</span></div><div class="counterbar"><div class="counterfill" id="bar" style="width:100%"></div></div><div class="card"><h2>${escape(q[0])}</h2><div class="options">${opts.map((o,i)=>`<button class="option" data-option="${i}">${String.fromCharCode(65+i)}. ${escape(o.label)}</button>`).join('')}</div><div class="quizfoot" id="feedback"><p class="small">Elige una respuesta antes de que termine el tiempo.</p></div><button class="btn" id="nextq" hidden>${pos===round.length-1?'Ver resultados':'Siguiente pregunta →'}</button></div>`;$('#quiz').innerHTML=html;$('#quiz').dataset.answers=JSON.stringify(opts.map(o=>o.correct));clock=setInterval(()=>{remaining--;const e=$('#timer'),bar=$('#bar');if(e){e.textContent=remaining+' s';e.classList.toggle('danger',remaining<=5)}if(bar)bar.style.width=(remaining/20*100)+'%';if(remaining<=0){clearInterval(clock);choose(-1)}},1000)}
function choose(n){if(answered)return;answered=true;clearInterval(clock);let qi=round[pos],q=DATA.questions[qi],opts=JSON.parse($('#quiz').dataset.answers);let good=n>=0&&opts[n];quizAttempts[qi]=(quizAttempts[qi]||0)+1;if(!(qi in quizFirst))quizFirst[qi]=!!good;if(good)quizPending.delete(qi);else quizPending.add(qi);document.querySelectorAll('[data-option]').forEach(b=>{let i=Number(b.dataset.option);b.disabled=true;if(opts[i])b.classList.add('correct');else if(i===n)b.classList.add('wrong')});$('#feedback').innerHTML=`<div class="feedback ${good?'':'dangerbox'}"><strong>${good?'✓ Correcto':n===-1?'⌛ Se agotó el tiempo':'✕ Respuesta incorrecta'}</strong><p style="margin:5px 0">${escape(q[3])}</p></div>`;$('#nextq').hidden=false}
function drawResults(){clearInterval(clock);let firstGood=Object.values(quizFirst).filter(Boolean).length,pending=[...quizPending],total=QUIZ_COUNTS[quizSection],correctNow=total-pending.length;let s=`<div class="card"><h2>${pending.length?'Ronda completada':'¡Bloque completado!'}</h2><div class="result"><div class="stat"><strong>${total}</strong><span class="minor">Preguntas del bloque</span></div><div class="stat"><strong>${firstGood}/${total}</strong><span class="minor">Aciertos iniciales</span></div><div class="stat"><strong>${correctNow}/${total}</strong><span class="minor">Conceptos dominados</span></div></div>`;if(pending.length){s+=`<div class="hero"><strong>${pending.length} tarjetas por reforzar</strong><p>Repetirás solo las incorrectas o las que se quedaron sin respuesta.</p></div><p><button id="retry" class="btn">Repetir ${pending.length} falladas →</button></p>`}else{quizDone.add(quizSection);$('#forward').disabled=stage===TOTAL_STAGES-1;s+=`<div class="hero"><strong>Todos los conceptos dominados</strong><p>${quizSection===5?'Terminaste las ${DATA.questions.length} tarjetas de los 6 bloques.':'Puedes continuar a la siguiente sección teórica.'}</p></div><p><button id="restart" class="btn secondary">Repetir las ${total} tarjetas</button> ${quizSection<5?'<button id="continue" class="btn">Continuar a la teoría →</button>':''}</p>`}s+='</div>';$('#quiz').innerHTML=s}
function retry(){round=shuffle([...quizPending]);pos=0;drawQuestion()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-left]');if(b){left=Number(b.dataset.left);tryMatch();return}b=e.target.closest('[data-right]');if(b){right=Number(b.dataset.right);tryMatch();return}b=e.target.closest('[data-stage]');if(b){change(Number(b.dataset.stage));return}b=e.target.closest('[data-option]');if(b){choose(Number(b.dataset.option));return}if(e.target.closest('#start')){start();return}if(e.target.closest('#nextq')){pos++;drawQuestion();return}if(e.target.closest('#retry')){retry();return}if(e.target.closest('#restart')){start();return}if(e.target.closest('#continue')){change(stage+1);return}});$('#back').onclick=()=>change(stage-1);$('#forward').onclick=()=>change(stage+1);render();
</script></body></html>
