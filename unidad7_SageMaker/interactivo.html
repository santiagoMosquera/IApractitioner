acenamiento de objetos que puede guardar datasets, modelos y resultados utilizados por SageMaker AI.", "Clave: S3 almacena; SageMaker entrena."], ["EDA (Exploratory Data Analysis)", "Explorar los datos para conocer su distribución, relaciones, valores faltantes y posibles anomalías.", "Clave: entender los datos antes de entrenar."], ["Data Cleaning", "Corregir o tratar datos duplicados, faltantes e inconsistentes.", "Ejemplo: eliminar duplicados y completar valores."], ["Data Imputation", "Sustituir valores faltantes; media/mediana para números y moda para categorías, según el caso.", "Clave: la estrategia depende de los datos."], ["Data Wrangler", "Herramientas visuales para explorar, preparar y transformar datos y crear características.", "Clave: preparación de datos."], ["Feature Engineering", "Crear o transformar variables para que aporten información al modelo.", "Ejemplo: Minutos_Totales = Día + Tarde + Noche."], ["Feature Selection", "Seleccionar características útiles y quitar las irrelevantes o problemáticas.", "Ejemplo: excluir Numero_Telefono."], ["SageMaker Ground Truth", "Permite crear datasets etiquetados, combinando trabajadores humanos y herramientas de ML.", "Clave: etiquetado de datos."]]], ["03 · Entrenar y evaluar", "De los datos al modelo", [["Entrenamiento (Training)", "Proceso por el que el modelo aprende patrones a partir de ejemplos.", "Clave: aprender de los datos."], ["AutoML / SageMaker Autopilot", "Automatiza tareas como preparar datos, seleccionar algoritmos, entrenar y ajustar modelos candidatos.", "Clave: automatización del desarrollo de ML."], ["Quick Build y Standard Build", "En Canvas: Quick Build sirve para iteración rápida; Standard Build realiza una búsqueda y entrenamiento más exhaustivos.", "Clave: rapidez frente a mayor exploración."], ["Clasificación", "Predice una categoría, como Sí/No o tipo de cliente.", "Ejemplo: ¿cancelará el servicio?"], ["Regresión", "Predice un valor numérico continuo.", "Ejemplo: precio de una vivie function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let rightOrder=shuffle(DATA.match.map((x,i)=>i));
const NEW_SAGEMAKER=new Set(['Amazon SageMaker AI','SageMaker Studio','SageMaker Canvas','Studio vs. Canvas','SageMaker Unified Studio','Data Wrangler','SageMaker Ground Truth','AutoML / SageMaker Autopilot','Quick Build y Standard Build','SageMaker Clarify','Ready-to-use models en Canvas','SageMaker JumpStart','SageMaker Model Monitor','SageMaker Pipelines','SageMaker Feature Store','SageMaker Model Registry','SageMaker Model Cards','SageMaker AI vs SageMaker Studio','Canvas vs Autopilot','JumpStart vs Ground Truth','Clarify vs Model Monitor']);
function header(k,title,lead){return `<div class="eyebrow">${k}</div><h1>${title}</h1><p class="lead">${lead}</p>`}
function render(){clearInterval(clock);clock=null;window.scrollTo({top:0,behavior:'instant'});let s='';
if(stage===0){s=header('ACTIVIDAD INICIAL · DESCUBRIMIENTO','¿Qué crees que significa cada concepto?','Antes de estudiar, relaciona los términos de SageMaker con su función. No necesitas conocer las respuestas: aquí queremos activar tus ideas previas.');s+=`<div class="instructions">Selecciona primero un concepto de la izquierda y después su definición de la derecha. Los aciertos se bloquean en verde. Puedes equivocarte y volver a intentarlo.</div><div class="matching"><div class="matchcol"><h3>Conceptos</h3>${DATA.match.map((x,i)=>`<button class="match ${matched.has(i)?'done':''} ${left===i?'selected':''}" data-left="${i}" ${matched.has(i)?'disabled':''}>${escape(x[0])}</button>`).join('')}</div><div class="matchcol"><h3>Significados</h3>${rightOrder.map(i=>`<button class="match ${matched.has(i)?'done':''} ${right===i?'selected':''}" data-right="${i}" ${matched.has(i)?'disabled':''}>${escape(DATA.match[i][1])}</button>`).join('')}</div></div><div class="hero" id="matchstatus"><strong>${matched.size} / ${DATA.match.length} parejas correctas</strong><p>${matched.size===DATA.match.length?'¡Actividad completada! Ya puedes estudiar los conceptos.':'Equivocaciones: '+matchMistakes+'. No hay penalización: esta actividad es exploratoria.'}</p></div>`;}
else if(stage<=DATA.sections.length){let [ey,title,concepts]=DATA.sections[stage-1];s=header(ey,title,'Identifica en celeste lo nuevo de SageMaker. Los conceptos generales de ML permanecen en blanco para repaso.');s+=`<div class="rail">${DATA.sections.map((sec,i)=>`<button data-stage="${i+1}" class="${stage===i+1?'active':''}">${i+1}. ${escape(sec[1])}</button>`).join('')}</div><div class="legend"><i></i> Títulos celestes: conceptos específicos de SageMaker para reconocer en el examen. Blanco: fundamentos de ML ya estudiados.</div><div class="grid">${concepts.map(([t,d,n])=>`<article class="card concept"><p class="definition"><strong class="${NEW_SAGEMAKER.has(t)?'new-service':''}">${escape(t)}:</strong> ${escape(d)}</p><div class="exam">${escape(n).replace(/^([^:]+:)/,'<strong>$1</strong>')}</div></article>`).join('')}</div>`;if(stage===3)s+=`<div class="hero"><strong>Data Leakage: dos casos que debes distinguir</strong><p><b>Train-Test Contamination:</b> los datos de prueba contienen información utilizada durante el entrenamiento.</p><p><b>Target Leakage:</b> una característica revela directa o indirectamente el resultado que queremos predecir; por ejemplo, <b>Fecha_Cancelacion</b> en churn.</p></div>`;}
else if(stage===DATA.sections.length+1){s=header('EVALUACIÓN FINAL · 20 SEGUNDOS','Identifica el concepto correcto','Cada pregunta presenta 4 opciones. Dispones de 20 segundos para responder. Al terminar la ronda puedes repetir solo las que fallaste o se agotó el tiempo.');s+=`<div class="card"><h2>Reto SageMaker · ${DATA.questions.length} preguntas</h2><p>Las preguntas evalúan definiciones y casos de selección de servicios, con retroalimentación inmediata. Las respuestas se mezclan en cada intento. Un error queda pendiente hasta contestarlo correctamente en una ronda de repaso.</p><div class="hero"><strong>Reglas:</strong><p>20 s por pregunta · 4 respuestas · el tiempo corre desde que aparece la pregunta · reintento exclusivo de errores · sin necesidad de conexión.</p></div><p style="margin-top:20px"><button id="start" class="btn">Iniciar evaluación →</button></p></div>`;}
else{s=header('EVALUACIÓN FINAL · PREGUNTAS','Reto contrarreloj', 'Responde antes de que termine el tiempo. Los errores y tiempos agotados se guardarán para repetirlos.');s+=`<div id="quiz"></div>`;}
$('#app').innerHTML=s;$('#back').disabled=stage===0;$('#forward').disabled=(stage===0&&matched.size<DATA.match.length)||stage>=DATA.sections.length+1;$('#where').textContent=stage===0?'Emparejar':stage<=DATA.sections.length?'Conceptos '+stage+' / '+DATA.sections.length:stage===DATA.sections.length+1?'Antes del reto':'Reto final';if(stage===last)drawQuestion();}
function change(n){if(n<0||n>last)return;if(stage===last)return;if(stage===0&&matched.size<DATA.match.length&&n>0)return;stage=n;render()}
function tryMatch(){if(left===null||right===null)return;if(left===right)matched.add(left);else{matchMistakes++;const a=document.querySelector(`[data-left="${left}"]`),b=document.querySelector(`[data-right="${right}"]`);a?.classList.add('wrong');b?.classList.add('wrong')}left=null;right=null;render()}
function start(){stage=last;round=shuffle(DATA.questions.map((_,i)=>i));pos=0;answered=false;mistakes=new Set();firstPass={};attempts={};done=false;render()}
function drawQuestion(){clearInterval(clock);if(pos>=round.length){drawResults();return}let qi=round[pos],q=DATA.questions[qi];answered=false;remaining=20;let opts=shuffle(q[1].map((v,i)=>({label:v,correct:i===q[2]})));let html=`<div class="scorebar"><span class="pill">Pregunta ${pos+1} / ${round.length}</span><span class="pill">Pendientes de repaso: ${mistakes.size}</span><span class="timer" id="timer">20 s</span></div><div class="counterbar"><div class="counterfill" id="bar" style="width:100%"></div></div><div class="card"><h2>${escape(q[0])}</h2><div class="options">${opts.map((o,i)=>`<button class="option" data-option="${i}">${String.fromCharCode(65+i)}. ${escape(o.label)}</button>`).join('')}</div><div class="quizfoot" id="feedback"><p class="small">Selecciona una respuesta antes de que se agote el tiempo.</p></div><button class="btn" id="nextq" hidden>${pos===round.length-1?'Ver resultados':'Siguiente pregunta →'}</button></div>`;$('#quiz').innerHTML=html;$('#quiz').dataset.answers=JSON.stringify(opts.map(o=>o.correct));clock=setInterval(()=>{remaining--;const e=$('#timer'),bar=$('#bar');if(e){e.textContent=remaining+' s';e.classList.toggle('danger',remaining<=5)}if(bar)bar.style.width=(remaining/20*100)+'%';if(remaining<=0){clearInterval(clock);choose(-1)}},1000)}
function choose(n){if(answered)return;answered=true;clearInterval(clock);let qi=round[pos],q=DATA.questions[qi],opts=JSON.parse($('#quiz').dataset.answers);let good=n>=0&&opts[n];attempts[qi]=(attempts[qi]||0)+1;if(!(qi in firstPass))firstPass[qi]=!!good;if(good)mistakes.delete(qi);else mistakes.add(qi);document.querySelectorAll('[data-option]').forEach(b=>{let i=Number(b.dataset.option);b.disabled=true;if(opts[i])b.classList.add('correct');else if(i===n)b.classList.add('wrong')});$('#feedback').innerHTML=`<div class="feedback ${good?'':'dangerbox'}"><strong>${good?'✓ Correcto':n===-1?'⌛ Se agotó el tiempo':'✕ Respuesta incorrecta'}</strong><p style="margin:5px 0">${escape(q[3])}</p></div>`;$('#nextq').hidden=false}
function drawResults(){clearInterval(clock);let all=DATA.questions.length,firstGood=Object.values(firstPass).filter(Boolean).length,pending=[...mistakes];let correctNow=all-pending.length;let s=`<div class="card"><h2>${pending.length?'Ronda completada':'¡Dominaste todos los conceptos!'}</h2><div class="result"><div class="stat"><strong>${all}</strong><span class="minor">Preguntas distintas</span></div><div class="stat"><strong>${firstGood}/${all}</strong><span class="minor">Aciertos al primer intento</span></div><div class="stat"><strong>${correctNow}/${all}</strong><span class="minor">Conceptos dominados</span></div></div>`;if(pending.length){s+=`<div class="hero"><strong>Quedan ${pending.length} pregunta(s) por reforzar</strong><p>Repetirás exclusivamente las incorrectas o no respondidas. El orden cambiará. El reto termina cuando no quedan errores.</p></div><p><button id="retry" class="btn">Repetir solo las ${pending.length} falladas →</button></p>`;s+=`<details><summary>Ver conceptos pendientes</summary><ol>${pending.map(i=>`<li>${escape(DATA.questions[i][0])}</li>`).join('')}</ol></details>`}else{s+=`<div class="hero"><strong>Repaso finalizado</strong><p>Has contestado correctamente las ${all} preguntas al menos una vez. Los fallos iniciales cuentan solo para la primera ronda, no como nuevos errores permanentes.</p></div><p><button id="restart" class="btn">Volver a comenzar el reto</button></p>`}s+=`<p class="minor">La evaluación se ejecuta en tu navegador. Si recargas la página, se reinicia la sesión.</p></div>`;$('#quiz').innerHTML=s}
function retry(){round=shuffle([...mistakes]);pos=0;drawQuestion()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-left]');if(b){left=Number(b.dataset.left);tryMatch();return}b=e.target.closest('[data-right]');if(b){right=Number(b.dataset.right);tryMatch();return}b=e.target.closest('[data-stage]');if(b){change(Number(b.dataset.stage));return}b=e.target.closest('[data-option]');if(b){choose(Number(b.dataset.option));return}if(e.target.closest('#start')){start();return}if(e.target.closest('#nextq')){pos++;drawQuestion();return}if(e.target.closest('#retry')){retry();return}if(e.target.closest('#restart')){start();return}});$('#back').onclick=()=>change(stage-1);$('#forward').onclick=()=>change(stage+1);render();
</script></body></html>
