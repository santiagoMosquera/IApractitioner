<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El algoritmo del cielo</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#edf4ff;background:#081322}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 26px;background:#0c1b2edc;backdrop-filter:blur(10px);border-bottom:1px solid #28405a}header strong{letter-spacing:.5px}.pill{font-size:13px;color:#a2bad4}main{max-width:1180px;margin:auto;padding:22px 24px 100px}h1{font-size:clamp(30px,5vw,58px);line-height:1.07;margin:10px 0 17px}h2{font-size:clamp(26px,3.6vw,43px);margin:6px 0 14px}p,.lead{font-size:clamp(16px,1.65vw,20px);line-height:1.58}.lead{color:#bdcde0}.portada{max-height:75vh;object-fit:contain}.hero{width:100%;max-height:57vh;object-fit:contain;border-radius:18px;background:#12253b}.panel{border:1px solid #294665;border-radius:16px;padding:20px;margin:18px 0;background:#122238}.panel h3{margin:0 0 14px}.row{display:flex;gap:16px;flex-wrap:wrap}.col{flex:1;min-width:260px}.choice{display:block;width:100%;text-align:left;background:#213651;color:#eef7ff;border:1px solid #4c6685;border-radius:10px;padding:13px 16px;margin:9px 0;font:inherit;cursor:pointer}.choice:hover{background:#345271}.choice.selected{border-color:#64b8f9;background:#214c70}.choice.good{background:#145e4d;border-color:#4bf0ad}.choice.bad{background:#6f2737;border-color:#fa6a8c}.btn{padding:12px 18px;background:#ef4b65;color:white;border:0;border-radius:10px;font-weight:800;cursor:pointer;font-size:16px}.btn.secondary{background:#25405f}.btn:disabled{opacity:.36;cursor:not-allowed}.bar{display:flex;justify-content:space-between;gap:14px;margin-top:24px}.feedback{min-height:33px;color:#9bd1f6;margin-top:12px;font-size:16px}.hidden{display:none!important}.code{background:#07111f;color:#dff8ee;padding:20px;border-radius:12px;white-space:pre-wrap;font:17px/1.6 Consolas,monospace;overflow:auto}.kw{color:#e98af9}.str{color:#ffce70}.var{color:#80e2ff}table{width:100%;border-collapse:collapse;font-size:clamp(13px,1.4vw,17px)}th,td{padding:12px 9px;text-align:center;border-bottom:1px solid #36516f}th:first-child,td:first-child{text-align:left}th{color:#8fd6ff}input,textarea,select{background:#213955;color:white;border:1px solid #6e8ca7;border-radius:8px;padding:11px;font:inherit;max-width:100%}input[type=number]{width:92px}textarea{width:100%;min-height:95px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{background:#1b3450;border-radius:12px;padding:15px}.stat b{display:block;font-size:26px;margin:7px 0}.small{font-size:14px;color:#adc2d8}.goodtext{color:#61e8b1}.badtext{color:#ff8999}.story{font-size:20px;padding:16px 22px;border-left:4px solid #ed526e;background:#14243b;border-radius:8px}.progress{height:4px;background:#253b55}.progress>div{height:100%;background:#ed526e;transition:width .2s}.tag{color:#ffca66}.sub{font-size:15px;color:#9bb4cd}.actions{margin-top:20px}.answerbox{padding:15px;background:#183a54;border-radius:12px;margin:12px 0}label{cursor:pointer} .opt{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:17px}.badge{display:inline-block;background:#244362;border-radius:30px;padding:7px 14px;font-weight:700}.intro{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}@media(max-width:800px){.intro{display:block}main{padding:16px 14px 90px}.panel{padding:13px}.bar{position:sticky;bottom:0;background:#09192fe8;padding:12px 0}header{padding:10px}}
.choice.selected:not(.good):not(.bad){border-color:#50c4ff;background:rgba(80,196,255,.15);box-shadow:inset 0 0 0 1px #50c4ff}.hint{font-size:.94rem;opacity:.82}</style><style>.destino-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}.destino-form label{display:flex;flex-direction:column;gap:6px;font-weight:650}.destino-form input,.destino-form select{width:100%;box-sizing:border-box;min-height:40px;padding:8px 10px;border-radius:9px}.destino-form select{color:#f6f7fa;background:#16233c;border:1px solid #65718a}.destino-form input{color:#f6f7fa;background:#16233c;border:1px solid #65718a}#guestResult{margin-top:12px}@media(max-width:650px){.destino-form{grid-template-columns:1fr}}</style></head><body><header><strong>KRAKE<span style="color:#f6536c">DEV</span> · EL ALGORITMO DEL CIELO</strong><span class="pill" id="num"></span></header><div class="progress"><div id="progressFill"></div></div><main><div id="content"></div><div class="bar"><button class="btn secondary" id="prev">← Anterior</button><select id="menu" aria-label="Páginas"></select><button class="btn" id="next">Siguiente →</button></div></main><script>
const slides=[{"title":"EL ALGORITMO DEL CIELO","body":"<img class=\"hero portada\" src=\"imagenes/portada.png\" alt=\"El Algoritmo del Cielo — KrakeDev\"/>","image":null,"quiz":null},{"title":"Una cola interminable","body":"<img class=\"hero\" src=\"imagenes/sanPedro1.png\" alt=\"Escena de San Pedro\"/><p class=\"lead\">Cada día llegan nuevas personas. San Pedro debe revisar sus expedientes y tomar una decisión: CIELO o INFIERNO.</p><div class=\"panel\" data-quiz><h3>¿Qué problema quiere resolver San Pedro?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Clasificar personas en dos categorías</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Predecir el número de llegadas por año</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Agrupar por música sin decidir destino</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"0\" data-explain=\"\"></div></div>","image":null,"quiz":null},{"title":"San Pedro se convierte en programador","body":"<img class=\"hero\" src=\"imagenes/sanPedro2.png\" alt=\"Escena de San Pedro\"/><p class=\"lead\">Aprendió a programar y escribió sus primeras condiciones.</p><div class=\"code\"><span class=\"kw\">if</span> (generoMusical === <span class=\"str\">\"rock\"</span>) {\n  destino = <span class=\"str\">\"infierno\"</span>;\n} <span class=\"kw\">else if</span> (religion === <span class=\"str\">\"cristiano\"</span>) {\n  destino = <span class=\"str\">\"cielo\"</span>;\n}</div>","image":null,"quiz":null},{"title":"¡Llegó un rockero cristiano!","body":"<img class=\"hero\" src=\"imagenes/sanPedro3.png\" alt=\"Escena de San Pedro\"/><p class=\"lead\">San Pedro descubre que sus reglas producen resultados inesperados.</p><div class=\"panel\" data-quiz><h3>¿Por qué si es cristiano, no va al cielo?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Porque primero detecta que es rockero</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Porque a diosito no gusta el rock</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Porque la computadora no puede comparar cadenas</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"0\" data-explain=\"La primera condición sobre rock se cumple y el else if ya no se revisa.\"></div></div>","image":null,"quiz":null},{"title":"Corrige el código","body":"<p class=\"lead\">Elige el código correcto para que un rockero cristiano sí vaya al cielo.</p><div class=\"panel\" data-quiz><h3>¿Cuál de estos códigos lo permite?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\" style=\"border-left:5px solid #ffbf69;\"><span style=\"color:#ffbf69;font-weight:800\">OPCIÓN 1</span><pre style=\"white-space:pre-wrap;color:#eaf4ff;font:16px/1.6 Consolas,monospace;margin:9px 0 0\"><span style=\"color:#dd9aff\">if</span> (generoMusical === <span style=\"color:#ffd27a\">\"rock\"</span> <span style=\"color:#e9a2ff\">&amp;&amp;</span> religion !== <span style=\"color:#ffd27a\">\"cristiano\"</span>) {\n    <span style=\"color:#84deff\">destino</span> = &quot;cielo&quot;;\n}</pre></button><button class=\"choice\" data-pick=\"1\" type=\"button\" style=\"border-left:5px solid #70e2ae;\"><span style=\"color:#70e2ae;font-weight:800\">OPCIÓN 2</span><pre style=\"white-space:pre-wrap;color:#eaf4ff;font:16px/1.6 Consolas,monospace;margin:9px 0 0\"><span style=\"color:#dd9aff\">if</span> (generoMusical === <span style=\"color:#ffd27a\">\"rock\"</span> <span style=\"color:#e9a2ff\">&amp;&amp;</span> religion === <span style=\"color:#ffd27a\">\"cristiano\"</span>) {\n    <span style=\"color:#84deff\">destino</span> = &quot;cielo&quot;;\n}</pre></button><button class=\"choice\" data-pick=\"2\" type=\"button\" style=\"border-left:5px solid #f48ca8;\"><span style=\"color:#f48ca8;font-weight:800\">OPCIÓN 3</span><pre style=\"white-space:pre-wrap;color:#eaf4ff;font:16px/1.6 Consolas,monospace;margin:9px 0 0\"><span style=\"color:#dd9aff\">if</span> (generoMusical === <span style=\"color:#ffd27a\">\"rock\"</span> <span style=\"color:#e9a2ff\">&amp;&amp;</span> religion === <span style=\"color:#ffd27a\">\"cristiano\"</span>) {\n    <span style=\"color:#84deff\">destino</span> = &quot;infierno&quot;;\n}</pre></button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"La opción 2 asigna cielo cuando se cumplen ambas condiciones: rock y cristiano.\"></div></div>","image":null,"quiz":null},{"title":"Cada día, nuevas excepciones","body":"<img class=\"hero\" src=\"imagenes/sanPedro4.png\" alt=\"Escena de San Pedro\"/><p class=\"lead\">Nuevas combinaciones cada vez más extrañas<br>reguetón cristiano, rock instrumental, personas que cambiaron de religión, políticos honestos, programadores que juegan bien fútbol, mujeres que no mienten (todas mienten).<br>Cada vez es más complejo programar todas las condiciones posibles</p><div class=\"panel\" data-quiz><h3>Hasta este momento, ¿qué solución está usando?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Programación mediante reglas explicitas, no está usando IA</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Supervised Learning con etiquetas</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Deep Learning de redes neuronales</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"0\" data-explain=\"\"></div></div>","image":null,"quiz":null},{"title":"¡Se le coló Adolfito al cielo!!","body":"<img class=\"hero\" src=\"imagenes/sanPedro5.png\" alt=\"Escena de San Pedro\"/><p class=\"lead\">Las condiciones anidadas son difíciles de mantener, empieza a tener errores graves. San Pedro busca un sistema donde pueda añadir y combinar reglas de conocimiento.... y San Pedrito sabe que es momento de usar Inteligencia Artificial.</p>","image":null,"quiz":null},{"title":"Un motor de inferencia","body":"<img class=\"hero\" src=\"imagenes/sanPedro6.png\" alt=\"Escena de San Pedro\"/><p class=\"lead\">Una base de conocimiento reúne reglas explícitas. El motor de inferencia las aplica a los hechos de cada expediente para llegar a conclusiones.</p><div class=\"panel\"><h3>Reglas explícitas del sistema</h3><ol class=\"rules-list\"><li>Si va a la misa entonces es catolico.</li><li>Si es catolico pero asesino entonces es malo.</li><li>Si es hincha del barcelona y llueve entonces saquea el TIA.</li><li>SI es hincha del barcelona y hay un temblor entonces saquea el TIA.</li><li>Si saquea entonces roba.</li><li>Si roba entonces incumple un mandamiento.</li><li>Si incumple un mandamiento entonces es malo.</li><li>Si es malo va al cielo</li><li>Si es bueno va al infierno</li><li>Si incumple uno o varios mandamientos y se arrepiente con su ultimo aliento entonces ya no imcumple.</li><li>Si peca y pide perdón entonces empata.</li></ol><p class=\"small\">Reglas ficticias del ejercicio: algunas pueden ser contradictorias. Su propósito es explorar cómo razona un sistema basado en reglas.</p></div><div class=\"panel\"><h3>Agrega una regla de inferencia</h3><label>Tu nueva regla <textarea id=\"rule1\" placeholder=\"SI ... ENTONCES ...\"></textarea></label><button class=\"btn\" data-rules>Registrar regla</button><div id=\"ruleFeedback\" class=\"feedback\"></div></div>","image":null,"quiz":null},{"title":"¿Es Inteligencia Artificial?","body":"<p class=\"lead\">El motor puede deducir nuevas conclusiones aplicando reglas, sin aprender automáticamente patrones a partir de ejemplos.</p><div class=\"panel\" data-quiz><h3>Selecciona la descripción más adecuada</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Inteligencia Artificial simbólica, pero no Machine Learning</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Unsupervised Learning</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Deep Learning</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"0\" data-explain=\"\"></div></div><div class=\"panel\" data-quiz><h3>¿Cuál relación es correcta?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Toda IA es Deep Learning</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Todo Machine Learning es IA</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Todo sistema de reglas es Machine Learning</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"\"></div></div>","image":null,"quiz":null},{"title":"Nooooo el buen Gandhi al infierno","body":"<img class=\"hero\" src=\"imagenes/sanPedro7.png\" alt=\"San Pedro envía a Gandhi al infierno\"/><p class=\"lead\">Un expediente se clasifica incorrectamente. San Pedro decide aprovechar los millones de registros que tiene de la gente que fue al cielo y al infierno y usar Inteligencia Artificial, pero esta vez con <b>Machine Learning</b>.</p>","image":null,"quiz":null},{"title":"Aprender de los expedientes","body":"<p class=\"lead\">El archivo histórico ya contiene las características de cada persona y la evaluación final registrada.</p><div class=\"panel\"><table><thead><tr><th>Persona ficticia</th><th>LLucho</th><th>Tuvo Suegra</th><th>Música</th><th>Ayudó</th><th>Infracciones</th><th>Evaluación</th></tr></thead><tbody><tr><td>Adán</td><td>Sí</td><td>No</td><td>Ninguna</td><td>No</td><td>Sí</td><td>Bueno</td></tr><tr><td>Eva</td><td>Sí</td><td>No</td><td>Ninguna</td><td>Sí</td><td>No</td><td>Bueno</td></tr><tr><td>Gandhi</td><td>No</td><td>No</td><td>Instrumental</td><td>Sí</td><td>No</td><td>Bueno</td></tr><tr><td>Maradona</td><td>No</td><td>No</td><td>Tango</td><td>Sí</td><td>No</td><td>Malo</td></tr><tr><td>Adolfito</td><td>No</td><td>No</td><td>Clásica</td><td>No</td><td>Sí</td><td>Malo</td></tr></tbody></table></div><div class=\"panel\" data-quiz=\"\"><h3>¿Qué tipo de aprendizaje permite entrenar con estos registros etiquetados?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Reinforcement Learning</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Supervised Learning</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Unsupervised Learning</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"\"></div></div><div class=\"panel\" data-quiz=\"\"><h3>¿Qué representa «Bueno / Malo» en el historial?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Features</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Labels</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Algoritmo</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"\"></div></div><div class=\"panel\" data-quiz=\"\"><h3>Clasificar un expediente nuevo con un modelo ya entrenado es…</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Entrenamiento</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Clustering</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Inferencia</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"2\" data-explain=\"\"></div></div>","image":null,"quiz":null},{"title":"¡San Pedro entrenó un modelo!","body":"<div class=\"panel\" data-quiz=\"\"><h3>¿Qué recibe un modelo durante la inferencia de una persona nueva?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Características de entrada; genera una predicción</button><button class=\"choice\" data-pick=\"1\" type=\"button\">La respuesta verdadera antes de predecir</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Reglas nuevas escritas por el usuario</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"0\" data-explain=\"\"></div></div>","image":null,"quiz":null},{"title":"¡NOOOOO, el buen BATMAN al infierno!","body":"<img class=\"hero\" src=\"imagenes/sanPedro8.png\" alt=\"San Pedro, Batman y el Guasón\"/><p class=\"lead\">Como todo modelo tiene su porcentaje de falla, pero el buen <b>BATMAN</b> al infierno ¡NOOOOOO!</p><p class=\"lead\">San Pedro quiere mejorar su modelo, le va a pasar más datos que tenía guardados para entrenarle mejor, pero el diablo ha borrado las etiquetas.</p><img class=\"hero\" src=\"imagenes/sanPedro12.png\" alt=\"El diablo borrando etiquetas en los libros\"/>","image":null,"quiz":null},{"title":"¡Desaparecieron las etiquetas!","body":"<p class=\"lead\">El diablo borra la columna de evaluación histórica. San Pedro todavía conserva los datos de cada persona, pero no las etiquetas.</p><div class=\"panel\"><table><thead><tr><th>Persona</th><th>LLucho</th><th>Tuvo Suegra</th><th>Música</th><th>Ayudó</th><th>Infracciones</th></tr></thead><tbody><tr><td>Rodrigo</td><td>Sí</td><td>No</td><td>Ninguna</td><td>No</td><td>Sí</td></tr><tr><td>Valentina</td><td>Sí</td><td>No</td><td>Ninguna</td><td>Sí</td><td>No</td></tr><tr><td>Camilo</td><td>No</td><td>No</td><td>Instrumental</td><td>Sí</td><td>No</td></tr><tr><td>Isabela</td><td>No</td><td>No</td><td>Tango</td><td>Sí</td><td>No</td></tr><tr><td>Fabián</td><td>No</td><td>No</td><td>Clásica</td><td>No</td><td>Sí</td></tr></tbody></table></div><div class=\"panel\" data-quiz=\"\"><h3>¿Qué técnica podría usar para encontrar grupos sin etiquetas?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Clasificación supervisada</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Clustering no supervisado</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Regresión lineal supervisada</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"\"></div></div>","image":null,"quiz":null},{"title":"K-Means forma grupos","body":"<img class=\"hero\" src=\"imagenes/sanPedro9.png\" alt=\"Escena de San Pedro\"/><p class=\"lead\">El algoritmo asigna personas a grupos por semejanza y ajusta sus centroides. No determina quién es bueno o malo.</p><div class=\"panel\" data-quiz><h3>¿Cuál combinación describe este proceso?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Supervised Learning → Regression → K-Means</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Unsupervised Learning → Clustering → K-Means</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Deep Learning → Classification → K-Means</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"\"></div></div>","image":null,"quiz":null},{"title":"¿Y van al cielo o al infierno?","body":"<img class=\"hero\" src=\"imagenes/sanPedro10.png\" alt=\"Escena de San Pedro\"/><p class=\"lead\">San Pedro pregunta qué grupo es bueno o malo. K-Means responde: «Ese no es mi problema. Yo solo agrupo».</p><div class=\"panel\" data-quiz><h3>¿Quién asigna un significado moral o empresarial a los grupos?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">El algoritmo lo sabe sin contexto</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Una persona o sistema con criterios externos</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Siempre el centroide</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"\"></div></div>","image":null,"quiz":null},{"title":"Ahora llegan videos y audios","body":"<img class=\"hero\" src=\"imagenes/sanPedro11.png\" alt=\"Escena de San Pedro\"/><p class=\"lead\">TikTok, mensajes de voz, fotografías y publicaciones presentan nuevos tipos de datos. San Pedro incorpora modelos de Deep Learning para analizar imágenes, audio y texto.</p><div class=\"panel\" data-quiz><h3>¿Qué relación es correcta?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Deep Learning es un subconjunto de Machine Learning</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Machine Learning es un subconjunto de Deep Learning</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Toda IA necesariamente usa redes neuronales profundas</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"0\" data-explain=\"\"></div></div>","image":null,"quiz":null},{"title":"¿Deep Learning nunca se equivoca?","body":"<div class=\"panel\" data-quiz><h3>San Pedro usa redes neuronales profundas. ¿Puede garantizar predicciones perfectas?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Sí, por usar Deep Learning</button><button class=\"choice\" data-pick=\"1\" type=\"button\">No; debemos evaluar sus errores</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Sí, si agrega suficientes variables</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"\"></div></div><p class=\"lead\">La tecnología cambió. El problema de evaluar las predicciones continúa.</p>","image":null,"quiz":null},{"title":"ANALICEMOS LAS MÉTRICAS DEL MODELO","body":"<p class=\"lead\"><b>Para nuestro análisis:</b></p><div class=\"grid\"><div class=\"stat\"><h3>BUENO (+)</h3><p>Clase positiva</p></div><div class=\"stat\"><h3>MALO (−)</h3><p>Clase negativa</p></div></div><p>Recuerda: La palabra positivo identifica la clase que decidimos evaluar, no significa que la predicción sea correcta. Verdadero o falso indica si acertó.</p><p class=\"lead\">Completa las etiquetas de la matriz de confusión.</p><div class=\"panel\"><table><tr><th>Realidad / Predicción</th><th>Infirió BUENO (+)</th><th>Infirió MALO (−)</th></tr><tr><th>Realmente BUENO</th><td><select data-symbol=\"VP\"></select></td><td><select data-symbol=\"FN\"></select></td></tr><tr><th>Realmente MALO</th><td><select data-symbol=\"FP\"></select></td><td><select data-symbol=\"VN\"></select></td></tr></table><button class=\"btn\" data-check-symbol>Comprobar siglas</button><div class=\"feedback\" id=\"matrixFeedback\"></div></div><div class=\"panel\" data-quiz><h3>San Pedro predice BUENO, pero la persona era MALA. ¿Cuál fue el resultado?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Verdadero positivo</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Falso positivo</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Falso negativo</button><button class=\"choice\" data-pick=\"3\" type=\"button\">Verdadero negativo</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"\"></div></div><div class=\"panel\" data-quiz><h3>San Pedro predice MALO, pero realmente era BUENO. ¿Cuál fue el resultado?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Falso negativo</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Falso positivo</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Verdadero positivo</button><button class=\"choice\" data-pick=\"3\" type=\"button\">Verdadero negativo</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"0\" data-explain=\"\"></div></div>","image":null,"quiz":null},{"title":"Relaciona las cuatro métricas","body":"<p class=\"lead\">No necesitas fórmulas. Relaciona cada pregunta con la métrica que ayudaría a San Pedro a tomar una decisión.</p><div class=\"panel\" id=\"matches\"><div class=\"grid\"><label class=\"stat\">¡Quiero atraparlos a todos! Que no se escape ningún BUENO.<select data-match=\"Recall\"><option value=\"\">Selecciona</option><option>Accuracy</option><option>Precision</option><option>Recall</option><option>F1 Score</option></select></label><label class=\"stat\">¡Quiero que mis admisiones sean correctas! Que no entren MALOS por error.<select data-match=\"Precision\"><option value=\"\">Selecciona</option><option>Accuracy</option><option>Precision</option><option>Recall</option><option>F1 Score</option></select></label><label class=\"stat\">¡Quiero acertar tanto con BUENOS como con MALOS!<select data-match=\"Accuracy\"><option value=\"\">Selecciona</option><option>Accuracy</option><option>Precision</option><option>Recall</option><option>F1 Score</option></select></label><label class=\"stat\">¡Quiero una buena combinación de Recall y Precision!<select data-match=\"F1 Score\"><option value=\"\">Selecciona</option><option>Accuracy</option><option>Precision</option><option>Recall</option><option>F1 Score</option></select></label><label class=\"stat\">De todas las personas realmente BUENAS, ¿qué porcentaje clasificó correctamente el modelo como BUENAS?<select data-match=\"Recall\"><option value=\"\">Selecciona</option><option>Accuracy</option><option>Precision</option><option>Recall</option><option>F1 Score</option></select></label><label class=\"stat\">De todas las personas clasificadas como BUENAS, ¿qué porcentaje realmente era BUENO?<select data-match=\"Precision\"><option value=\"\">Selecciona</option><option>Accuracy</option><option>Precision</option><option>Recall</option><option>F1 Score</option></select></label><label class=\"stat\">Del total de personas evaluadas, ¿qué porcentaje clasificó correctamente, tanto BUENAS como MALAS?<select data-match=\"Accuracy\"><option value=\"\">Selecciona</option><option>Accuracy</option><option>Precision</option><option>Recall</option><option>F1 Score</option></select></label></div><button class=\"btn\" data-check-match>Comprobar</button><div class=\"feedback\" id=\"matchFeedback\"></div></div>","image":null,"quiz":null},{"title":"Cuatro métricas, cuatro decisiones","body":"<p class=\"lead\">La misión de San Pedro cambia según el problema. Cada métrica responde a una pregunta distinta.</p><div class=\"grid\"><div class=\"stat\"><h3>RECALL</h3><b>¡Que no se escape ni un BUENO!</b><p>¿Estoy logrando admitir a quienes realmente merecen entrar?</p></div><div class=\"stat\"><h3>PRECISION</h3><b>¡Que mis admisiones sean confiables!</b><p>De los admitidos como BUENOS, ¿cuántos realmente lo son? Si se cuelan MALOS, hay falsos positivos.</p></div><div class=\"stat\"><h3>ACCURACY</h3><b>¡Acertar en ambas categorías!</b><p>¿Cuántas decisiones fueron correctas, tanto al admitir BUENOS como al rechazar MALOS?</p></div><div class=\"stat\"><h3>F1 SCORE</h3><b>¡Combinar Recall y Precision!</b><p>¿Qué tan bien combina el modelo ambas capacidades? Ayuda a comparar, pero no decide por sí solo qué error es más grave.</p></div></div><p class=\"lead\">Las fórmulas ya las conocimos en la clase anterior. Aquí nos interesa <b>interpretar las decisiones</b>.</p>","image":null,"quiz":null},{"title":"¡Buenos enviados al infierno!","body":"<p class=\"lead\">San Pedro descubre que varias personas realmente BUENAS terminaron en el infierno. Quiere que ningún BUENO se quede fuera.</p><div class=\"panel\" data-quiz><h3>¿Qué métrica debería priorizar San Pedro?</h3><button class=\"choice\" type=\"button\" data-pick=\"0\">Precision</button><button class=\"choice\" type=\"button\" data-pick=\"1\">Recall</button><button class=\"choice\" type=\"button\" data-pick=\"2\">Accuracy</button><button class=\"choice\" type=\"button\" data-pick=\"3\">F1 Score</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"Recall responde si logramos atrapar a todos los BUENOS reales. Es el objetivo principal de este problema.\"></div></div><div class=\"panel\" data-quiz><h3>Una nueva versión del modelo deja entrar a más BUENOS, pero también admite por error a más MALOS. ¿Qué conclusión es correcta?</h3><button class=\"choice\" type=\"button\" data-pick=\"0\">Mejorar Recall puede generar más admisiones equivocadas; debemos revisar también Precision</button><button class=\"choice\" type=\"button\" data-pick=\"1\">Si detecta más BUENOS, todos los demás resultados son correctos</button><button class=\"choice\" type=\"button\" data-pick=\"2\">Accuracy siempre será del 100 %</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"0\" data-explain=\"Rescatar más BUENOS favorece Recall, pero las admisiones de MALOS afectan la confiabilidad de las predicciones positivas.\"></div></div>","image":null,"quiz":null},{"title":"¡Se cuelan malos en el cielo!","body":"<p class=\"lead\">Las puertas se abren demasiado y personas MALAS entran al cielo. San Pedro quiere reducir esas admisiones equivocadas.</p><div class=\"panel\"><h3>¿Qué cambia si las puertas se hacen más estrictas?</h3><p>Puede disminuir la cantidad de MALOS admitidos, pero también existe el riesgo de dejar fuera a BUENOS.</p></div><div class=\"panel\" data-quiz><h3>¿En qué métrica debe fijarse especialmente para que sus admisiones como BUENO sean más confiables?</h3><button class=\"choice\" type=\"button\" data-pick=\"0\">Recall</button><button class=\"choice\" type=\"button\" data-pick=\"1\">Precision</button><button class=\"choice\" type=\"button\" data-pick=\"2\">Accuracy</button><button class=\"choice\" type=\"button\" data-pick=\"3\">F1 Score</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"Precision evalúa cuántos de los que el modelo declaró BUENOS realmente lo eran; admitir MALOS es un falso positivo.\"></div></div><div class=\"panel\" data-quiz><h3>Una puerta muy estricta casi nunca admite personas MALAS, pero rechaza a muchos BUENOS. ¿Cuál es el problema?</h3><button class=\"choice\" type=\"button\" data-pick=\"0\">Recall puede ser bajo, porque se quedan fuera personas realmente BUENAS</button><button class=\"choice\" type=\"button\" data-pick=\"1\">Precision y Recall siempre son iguales</button><button class=\"choice\" type=\"button\" data-pick=\"2\">Si casi no hay admisiones erróneas, el modelo ya es perfecto</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"0\" data-explain=\"La puerta puede ser muy confiable al admitir, pero aun así dejar fuera a muchas personas BUENAS.\"></div></div>","image":null,"quiz":null},{"title":"Tres maneras de configurar el cielo","body":"<p class=\"lead\">Analiza qué está ocurriendo en las decisiones de San Pedro y elige la métrica adecuada. No necesitas calcular porcentajes.</p><div class=\"panel\" data-quiz><h3>San Pedro descubre que algunas personas que clasificó como BUENAS y admitió al cielo en realidad eran MALAS. ¿Qué métrica debe mejorar para reducir estos errores?</h3><button class=\"choice\" type=\"button\" data-pick=\"0\">Recall</button><button class=\"choice\" type=\"button\" data-pick=\"1\">Precision</button><button class=\"choice\" type=\"button\" data-pick=\"2\">Accuracy</button><button class=\"choice\" type=\"button\" data-pick=\"3\">F1 Score</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"Precision evalúa qué tan confiables son las admisiones como BUENO. Si se admiten MALOS por error, debemos mejorar Precision.\"></div></div><div class=\"panel\" data-quiz><h3>San Pedro descubre que algunas personas realmente BUENAS están siendo enviadas al infierno. ¿Qué métrica debe mejorar para detectar a todos los BUENOS?</h3><button class=\"choice\" type=\"button\" data-pick=\"0\">Accuracy</button><button class=\"choice\" type=\"button\" data-pick=\"1\">Precision</button><button class=\"choice\" type=\"button\" data-pick=\"2\">F1 Score</button><button class=\"choice\" type=\"button\" data-pick=\"3\">Recall</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"3\" data-explain=\"Recall: queremos atrapar a todos los BUENOS reales, que no se escape ninguno.\"></div></div><div class=\"panel\" data-quiz><h3>La puerta equilibrada tiene mejor F1 que otra configuración. ¿Qué podemos concluir?</h3><button class=\"choice\" type=\"button\" data-pick=\"0\">Es perfecta y nunca se equivoca</button><button class=\"choice\" type=\"button\" data-pick=\"1\">Combina mejor Recall y Precision según F1, pero debemos revisar el riesgo de cada error</button><button class=\"choice\" type=\"button\" data-pick=\"2\">Garantiza que ningún BUENO quedará fuera</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"F1 resume la combinación de Recall y Precision. No garantiza un modelo perfecto ni sustituye el análisis de los riesgos.\"></div></div><div class=\"panel\" data-quiz data-multi=\"2\"><h3>La puerta equilibrada tiene un porcentaje alto de aciertos detectando BUENOS y un alto porcentaje de aciertos detectando MALOS. ¿Qué podemos concluir? (Elige 2)</h3><p class=\"hint\">Selecciona dos respuestas.</p><button class=\"choice\" type=\"button\" data-pick=\"0\">Tendrá un Accuracy alto</button><button class=\"choice\" type=\"button\" data-pick=\"1\">Tendrá un Accuracy bajo</button><button class=\"choice\" type=\"button\" data-pick=\"2\">Tendrá un Recall bajo</button><button class=\"choice\" type=\"button\" data-pick=\"3\">Tendrá un Recall alto</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"0,3\" data-explain=\"Accuracy mide los aciertos globales en BUENOS y MALOS. Recall mide qué porcentaje de los BUENOS reales se detectó.\"></div></div><div class=\"panel\" data-quiz><h3>Una configuración tiene muchos falsos positivos: muchas personas MALAS están siendo clasificadas como BUENAS. ¿Qué podemos afirmar?</h3><button class=\"choice\" type=\"button\" data-pick=\"0\">El Recall es alto</button><button class=\"choice\" type=\"button\" data-pick=\"1\">El Accuracy es alto</button><button class=\"choice\" type=\"button\" data-pick=\"2\">La Precision es baja</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"2\" data-explain=\"Precision mide la confiabilidad de las admisiones como BUENO. Cuando muchos admitidos como BUENOS son MALOS, Precision baja.\"></div></div>","image":null,"quiz":null},{"title":"¡El cielo cambia con el tiempo!","body":"<p class=\"lead\">Ahora llegan personas con hábitos y comportamientos distintos. Los datos cambian. San Pedro continúa usando el mismo modelo.</p><div class=\"panel\" data-quiz><h3>¿Qué debe hacer San Pedro con su sistema en producción?</h3><button class=\"choice\" data-pick=\"0\" type=\"button\">Confiar para siempre en el resultado inicial</button><button class=\"choice\" data-pick=\"1\" type=\"button\">Monitorear y evaluar con datos nuevos</button><button class=\"choice\" data-pick=\"2\" type=\"button\">Agregar más atributos sin comprobar resultados</button><div class=\"feedback\"></div><div class=\"hidden\" data-ans=\"1\" data-explain=\"\"></div></div><p class=\"lead\">¿Y si los expedientes históricos contienen prejuicios o decisiones injustas?</p>","image":null,"quiz":null},{"title":"¿Entrarás al cielo?","body":"<p class=\"lead\">Probemos uno de los modelos de San Pedro. No te diré cuál.</p>\n<div class=\"panel\">\n<h3>Completa tu información:</h3>\n<div class=\"destino-form\">\n<label>Tu nombre<input id=\"guest\" placeholder=\"Escribe tu nombre\" autocomplete=\"off\"></label>\n<label>¿Qué música prefieres?<select id=\"music\"><option value=\"\">Selecciona...</option><option value=\"salsa\">Salsa</option><option value=\"rock\">Rock</option><option value=\"chicha\">Chicha</option><option value=\"regueton\">Reguetón</option><option value=\"clasica\">Clásica</option><option value=\"otra\">Otra</option></select></label>\n<label>¿De qué equipo eres hincha?<select id=\"team\"><option value=\"\">Selecciona...</option><option value=\"barcelona\">Barcelona</option><option value=\"liga\">Liga</option><option value=\"idv\">IDV</option><option value=\"auquitas\">Aucas</option><option value=\"otro\">Otro</option></select></label>\n<label>Estado civil<select id=\"civil\"><option value=\"\">Selecciona...</option><option value=\"soltero\">Soltero</option><option value=\"casado\">Casado</option><option value=\"divorciado\">Divorciado</option><option value=\"viudo\">Viudo</option></select></label>\n</div>\n<button class=\"btn\" id=\"guestBtn\" type=\"button\">¿Entraré al cielo?</button>\n<div class=\"feedback\" id=\"guestResult\" role=\"status\" aria-live=\"polite\"></div>\n</div>","image":null,"quiz":null},{"title":"La próxima pregunta de San Pedro","body":"<img class=\"hero\" src=\"imagenes/sanPedro1.png\" alt=\"Escena de San Pedro\"/><div class=\"story\">«Tengo más y más datos… pero ¿cómo mantengo mi modelo funcionando, lo evalúo, controlo sus sesgos y decido cuándo volver a entrenarlo?»</div><p class=\"lead\">Ciclo de vida de Machine Learning · Datos · Entrenamiento · Evaluación · Despliegue · Monitoreo</p><div class=\"badge\">FIN · EL ALGORITMO DEL CIELO</div>","image":null,"quiz":null}];let page=0;const states={};function $all(s){return [...document.querySelectorAll(s)]}function getState(){return states[page]||(states[page]={})}function render(){let s=slides[page];document.title=s.title+' · El algoritmo del cielo';document.getElementById('progressFill').style.width=((page+1)/slides.length*100)+'%';document.getElementById('num').textContent=`${page+1} / ${slides.length}`;document.getElementById('content').innerHTML='<h1>'+s.title+'</h1>'+s.body;document.getElementById('prev').disabled=page===0;document.getElementById('next').textContent=page===slides.length-1?'Volver al inicio':'Siguiente →';document.getElementById('menu').value=page;let st=getState();$all('[data-quiz]').forEach((el,i)=>{let ans=el.querySelector('[data-ans]'),key='q'+i;if(st[key]!==undefined){if(el.hasAttribute('data-multi')){let chosen=String(st[key]).split(',').filter(Boolean);el.querySelectorAll('[data-pick]').forEach(b=>{if(chosen.includes(b.dataset.pick))b.classList.add('selected')});el.querySelector('.feedback').textContent=chosen.length===2?(String(st[key])===ans.dataset.ans?'✓ Correcto.':'Revisa tus dos respuestas. '+(ans.dataset.explain||'')):'Selecciona dos opciones.'}else{let btn=el.querySelector(`[data-pick="${st[key]}"]`);if(btn) btn.classList.add('selected',String(st[key])===ans.dataset.ans?'good':'bad');el.querySelector('.feedback').textContent=String(st[key])===ans.dataset.ans?'✓ Correcto.':('No es correcto. '+(ans.dataset.explain||'Inténtalo nuevamente.'))}}});if(st.rules){document.querySelector('#rule1')&&(document.querySelector('#rule1').value=st.rules[0]||'')}if(st.symbols){$all('[data-symbol]').forEach(el=>el.value=st.symbols[el.dataset.symbol]||'')}if(st.counts){$all('[data-count]').forEach(el=>el.value=st.counts[el.dataset.count]??'')}if(st.matches){$all('[data-match]').forEach(el=>el.value=st.matches[el.dataset.match]||'')}checkGate();window.scrollTo(0,0)}
function checkGate(){const qs=$all('[data-quiz]'),st=getState();let good=qs.every((el,i)=>String(st['q'+i])===el.querySelector('[data-ans]').dataset.ans);if(page===7)good=good&&!!st.rulesOk;if(document.querySelector('[data-symbol]'))good=good&&!!st.symbolsOk;if(document.querySelector('[data-match]'))good=good&&!!st.matchesOk;document.getElementById('next').disabled=!good}
document.addEventListener('click',e=>{let target=e.target.closest('[data-pick]');if(target){let el=target.closest('[data-quiz]'),qs=$all('[data-quiz]'),i=qs.indexOf(el),st=getState();if(el.hasAttribute('data-multi')){let key='q'+i;let picked=String(st[key]||'').split(',').filter(Boolean);let val=target.dataset.pick;if(picked.includes(val)){picked=picked.filter(x=>x!==val)}else if(picked.length<Number(el.dataset.multi)){picked.push(val)}picked.sort((x,y)=>Number(x)-Number(y));st[key]=picked.join(',');el.querySelectorAll('[data-pick]').forEach(b=>{b.className='choice';if(picked.includes(b.dataset.pick))b.classList.add('selected')});el.querySelector('.feedback').textContent=picked.length===2?(st[key]===el.querySelector('[data-ans]').dataset.ans?'✓ Correcto.':'Revisa tus dos respuestas. '+el.querySelector('[data-ans]').dataset.explain):'Selecciona dos opciones.';checkGate();return;}st['q'+i]=Number(target.dataset.pick);$all('[data-pick]',el);el.querySelectorAll('[data-pick]').forEach(b=>b.className='choice');let correct=String(target.dataset.pick)===el.querySelector('[data-ans]').dataset.ans;target.classList.add(correct?'good':'bad');el.querySelector('.feedback').textContent=correct?'✓ Correcto.':'Revisa tu respuesta. '+(el.querySelector('[data-ans]').dataset.explain||'Puedes seleccionar otra opción.');checkGate();return}
if(e.target.closest('[data-rules]')){let a=document.querySelector('#rule1').value.trim(),st=getState();st.rules=[a];st.rulesOk=/^si\s+.+\s+entonces\s+.+/i.test(a);document.querySelector('#ruleFeedback').textContent=st.rulesOk?'✓ Regla registrada.':'Escribe una regla con estructura SI ... ENTONCES ...';checkGate()}
if(e.target.closest('[data-check-symbol]')){let o={};$all('[data-symbol]').forEach(x=>o[x.dataset.symbol]=x.value);let ok=Object.entries(o).every(([k,v])=>k===v);getState().symbols=o;getState().symbolsOk=ok;document.getElementById('matrixFeedback').textContent=ok?'✓ Las cuatro siglas están correctas.':'Revisa cuáles decisiones son verdaderas/falsas y positivas/negativas.';checkGate()}
if(e.target.closest('[data-check-count]')){let o={};$all('[data-count]').forEach(x=>o[x.dataset.count]=x.value);let key={VP:350,FP:150,FN:50,VN:450};let ok=Object.keys(key).every(k=>o[k]!==''&&Number(o[k])===key[k]);getState().counts=o;getState().countsOk=ok;document.getElementById('countFeedback').textContent=ok?'✓ Matriz completada correctamente.':'Verifica los cuatro conteos con la información del informe.';checkGate()}
if(e.target.closest('[data-check-match]')){let o={};$all('[data-match]').forEach(x=>o[x.dataset.match]=x.value);let ok=Object.entries(o).every(([k,v])=>k===v);getState().matches=o;getState().matchesOk=ok;document.getElementById('matchFeedback').textContent=ok?'✓ ¡Bien! Identificaste las cuatro métricas.':'Algunas relaciones aún no coinciden. Revisa los puntos de partida de cada métrica.';checkGate()}
if(e.target.id==='guestBtn'){
  const name=document.querySelector('#guest').value.trim();
  const music=document.querySelector('#music').value;
  const team=document.querySelector('#team').value;
  const civil=document.querySelector('#civil').value;
  const result=document.querySelector('#guestResult');
  if(!name||!music||!team||!civil){result.textContent='Completa todos los campos para conocer tu destino.';return;}
  // La primera regla que coincide determina el mensaje. La música se evalúa antes que el equipo.
  let message;
  if(music==='rock') message='vas directito a la paila, en el cielo no admitimos Rockeros';
  else if(music==='regueton') message='vas directito a la paila, en el cielo no admitimos Reguetoneros';
  else if(team==='barcelona') message='vas directito a la paila, en el cielo no admitimos Barcelonistas';
  else if(team==='liga') message='vas directito a la paila, en el cielo no admitimos Liguistas';
  else message='¡bienvenido al cielo! San Pedro te deja pasar.';
  result.textContent=name+', '+message;
}
});
for(let el of document.querySelectorAll('select[data-symbol]')){}function initSymbols(){for(let s of $all('[data-symbol]')){if(s.options.length===0){s.innerHTML='<option value="">—</option>'+['VP','FP','FN','VN'].map(x=>`<option>${x}</option>`).join('')}}}
const origRender=render;render=function(){origRender();initSymbols();if(getState().symbols){$all('[data-symbol]').forEach(el=>el.value=getState().symbols[el.dataset.symbol]||'')}};
document.getElementById('prev').addEventListener('click',()=>{if(page>0){page--;render()}});document.getElementById('next').addEventListener('click',()=>{if(page<slides.length-1){page++;render()}else{page=0;render()}});let menu=document.getElementById('menu');slides.forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+' · '+s.title;menu.appendChild(o)});menu.addEventListener('change',()=>{page=Number(menu.value);render()});render();
</script></body></html>
